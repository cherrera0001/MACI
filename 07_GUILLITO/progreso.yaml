  - id: generalizacion
    estado: COMPRENSION_PARCIAL
    evidencias:
      explicar:
        fecha: 2026-09-19
        detalle: >-
          Distribution shift explicado correctamente y con el mecanismo, no solo
          la etiqueta: "es optimista, porque en 2016 CouncilArea siempre esta
          disponible". Identifico la direccion del sesgo (optimista, no
          pesimista) y la causa (la CV dentro de 2016 solo puede medir el
          escenario en que la feature esta presente al 100%). Antes habia
          llegado solo a nombrar "sobreajuste"; aqui explica el mecanismo.
      aplicar: null
      transferir: null
    sesiones: 1
    ultima_verificacion: 2026-09-19
    nota: >-
      Cubierto el caso de distribution shift por DISPONIBILIDAD de una feature.
      Falta el caso por cambio de relacion features-target, y falta APLICAR y
      TRANSFERIR. Segunda etapa abierta: trasladar un modelo de Melbourne 2016 a
      Gran Concepcion es un problema de generalizacion entre poblaciones,
      lugares y epocas distintas. Ver 07_GUILLITO/osint_gran_concepcion.md.

