# Memoria pedagogica de Cristobal
#
# UNICA fuente de verdad del avance. Guillito escribe aqui, y solo aqui.
# El plan de estudio vive en curriculum.yaml y no se toca.
# Los errores concretos viven en errores_conceptuales.yaml.
#
# ---------------------------------------------------------------------------
# LOS SEIS ESTADOS
#
#   NO_ESTUDIADO          No visto todavia.
#   EN_ESTUDIO            Guillito lo explico. Nada verificado aun.
#   COMPRENSION_PARCIAL   Lo explica, pero con huecos o imprecisiones.
#   COMPRENDIDO           Explica y aplica correctamente.
#   DOMINADO              Explica, aplica Y transfiere a un problema nuevo.
#   REQUIERE_REPASO       Lo sabia y fallo en una re-verificacion posterior.
#
# ---------------------------------------------------------------------------
# CADENA DE EVIDENCIA
#
#   EXPLICAR  ->  APLICAR  ->  TRANSFERIR
#
#   explicar     Lo explico con sus palabras, sin leer, sin que se lo dictaran.
#   aplicar      Resolvio un caso del mismo dominio, sin recibir la respuesta.
#   transferir   Resolvio un caso de OTRO dominio que no habia visto.
#
#   DOMINADO exige las TRES. No hay atajo.
#
# QUE NO ES EVIDENCIA
#   - Decir "entendi", "claro" o "tiene sentido".
#   - Repetir la explicacion de Guillito con otras palabras.
#   - Acertar despues de recibir la respuesta o una pista muy fuerte.
#   - Acertar por el motivo equivocado.
#
#   Si solo hay su palabra de que entendio, el estado es EN_ESTUDIO.
#
# Cada evidencia se registra como {fecha: AAAA-MM-DD, detalle: "que hizo"},
# no como true. Un booleano no es auditable; una linea de detalle si.
# ---------------------------------------------------------------------------

