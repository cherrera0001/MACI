  - id: train_validation_test
    estado: COMPRENDIDO
    evidencias:
      explicar:
        fecha: 2026-09-18
        detalle: >-
          Identifico el fenomeno correcto sin ayuda: "hay sobre 170 barrios
          nuevos" (son 172, cifra exacta). Ligo la degradacion en 2017 a la
          aparicion de zonas ausentes en 2016. Hueco: atribuyo el efecto a
          categorias desconocidas, sin advertir que Suburb y Postcode NO son
          features del modelo. El mecanismo real es extrapolacion en
          Lattitude/Longtitude. Explicacion correcta en direccion, incompleta
          en mecanismo.
      aplicar:
        fecha: 2026-09-18
        detalle: >-
          Diseno correcto del experimento CouncilArea sin ayuda: "entreno con
          5.702, comparo en los 634 y no toco 2017". Identifico los tres
          elementos -donde entrenar, donde decidir, que dejar intacto- y
          sostuvo la separacion. Ademas corrigio por su cuenta una imprecision
          propia: entendio que el 18,9% son valores FALTANTES de CouncilArea en
          2017 y no datos adicionales que se puedan "sumar". Esa distincion no
          se la dio Guillito.
      transferir: null
    sesiones: 1
    ultima_verificacion: 2026-09-18
    nota: >-
      Sesion 1 (2026-09-18). EXPLICAR y APLICAR cumplidos. Falta TRANSFERIR:
      debe disenar el mismo tipo de experimento en un dominio distinto de
      Melbourne. Dataset de transferencia entregado en
      07_GUILLITO/transferencia/. NO marcar DOMINADO hasta que resuelva ese
      caso sin recibir la solucion.

