# Registro de aprendizaje
#
# UNICA fuente de verdad del avance. El tutor escribe aqui, y solo aqui.
# El plan de estudio esta en curriculum.yaml y no se toca.
#
# ---------------------------------------------------------------------------
# ESTADOS
#   pendiente   No visto todavia.
#   en_curso    El tutor lo explico. Falta que el alumno lo explique de vuelta.
#   explicado   El alumno lo explico con sus palabras, correctamente.
#   en_duda     El alumno fallo. El error concreto queda en 'confusiones'.
#   dominado    Requiere LAS DOS evidencias. Ver regla abajo.
#
# REGLA DE DOMINIO (no negociable)
#   Un concepto pasa a 'dominado' solo si se cumplen las dos cosas:
#     1. explicacion_propia  -> lo explico con sus palabras, sin leer
#     2. ejercicio_nuevo     -> resolvio un caso que no habia visto antes,
#                               SIN que el tutor le diera la respuesta
#   Una sola evidencia no basta. Haber estudiado no es haber comprendido.
#
# RE-VERIFICACION
#   Cada concepto 'dominado' guarda ultima_verificacion. Al abrir sesion, el
#   tutor re-pregunta uno antiguo al azar. Si falla, vuelve a 'en_duda'.
#   Esto impide que 'dominado' sea una etiqueta que solo sube.
# ---------------------------------------------------------------------------

meta:
  alumno: Cristobal Herrera
  creado: 2026-09-18
  ultima_sesion: null
  sesiones_totales: 0
  diagnostico_inicial_hecho: false

resumen:
  dominado: 0
  explicado: 0
  en_duda: 0
  en_curso: 0
  pendiente: 21
  siguiente_recomendado: null   # lo fija el diagnostico inicial

# Errores que se repiten a traves de varios conceptos.
# No son fallos sueltos: son patrones. El tutor los agrega aqui cuando
