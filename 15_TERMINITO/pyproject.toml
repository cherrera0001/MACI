[project]
name = "datito"
version = "0.1.0"
description = "Motor de tutores agenticos disenados por el estudiante (MACI 1.0). Offline-first."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown>=3.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
datito = "datito.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
