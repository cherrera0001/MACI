[project]
name = "datito"
version = "1.1.0"
description = "Motor de tutores agenticos disenados por el estudiante (MACI 1.1). Offline-first."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown>=3.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# parsers de diapositivas y documentos (T-7.5.1): el zip distribuible se
# mantiene bajo 10 MB (contrato «sin secretos») y los parsers degradan con
# aviso si faltan. Instalación en desarrollo: uv pip install -e ".[docs]"
docs = ["python-docx>=1.0", "python-pptx>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
datito = "datito.cli:main"
datito-mcp = "datito.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
