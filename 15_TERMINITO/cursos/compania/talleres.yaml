talleres:
- id: anti-estafa-cotidiano
  titulo: Revisar un mensaje sospechoso
  tema: estafa claves banco mensaje urgencia
  pasos:
  - objetivo: 'Ante un mensaje que pida claves o contraseñas con urgencia, deténgase:
      no responda ni toque enlaces.'
    ayuda: 'Respire y recuerde: ningún banco pide claves por mensaje. Solo déjelo
      ahí, sin prisa.'
  - objetivo: 'Si habla de un premio, una transferencia o datos de su cuenta, trátelo
      como estafa: corte y no comparta.'
    ayuda: 'Piense en la señal de alarma: «premio» y «urgente» juntas casi siempre
      son engaño.'
  - objetivo: Corte la comunicación y consulte con alguien de confianza antes de responder
      o pagar.
    ayuda: Llame a su hermana o a un vecino y léales el mensaje; decidir en compañía
      siempre es más seguro.
  guia_fid: memoria#7
- id: videollamada-familia
  titulo: Videollamar a su familia
  tema: videollamada teléfono familia nietas fotos
  pasos:
  - objetivo: Abra la aplicación de videollamada y toque el nombre de su contacto
      en la lista.
    ayuda: Es el ícono verde de la cámara; buscar entre los contactos ya es practicar.
  - objetivo: Elija el ícono de video para llamar y espere con calma a que conteste.
    ayuda: 'Si no contestan, no pasa nada: deje un mensaje de voz con cariño.'
  - objetivo: Al terminar, cuelgue con el botón rojo; enséñele después sus fotos en
      el teléfono.
    ayuda: Repetir la llamada otro día la hará cada vez más fácil. Las fotos de sus
      nietas alegran la visita.
  guia_fid: memoria#10
- id: presupuesto-del-mes
  titulo: Ordenar los gastos del mes
  tema: gastos presupuesto cuaderno pensión mes
  pasos:
  - objetivo: 'Tome su cuaderno y anote lo que entra este mes: la pensión y cualquier
      otro ingreso.'
    ayuda: Solo números redondos; no necesita ser exacto.
  - objetivo: 'Liste los gastos que salen: luz, agua, comida y medicamentos; réstelos
      del total.'
    ayuda: Si algo le queda grande, anote solo los tres gastos más importantes.
  - objetivo: Cada semana descuente lo gastado y anote cuánto le queda para el resto
      del mes.
    ayuda: 'Ver el número escrito le da control: es su propio presupuesto casero.'
  guia_fid: memoria#11
