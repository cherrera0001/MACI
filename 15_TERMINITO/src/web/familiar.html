<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de bienestar · Datito</title>
<style>
/* Vista familiar (D-14.2): misma paleta cálida "Papel y Salvia" que el
   modo compañía (diseño gerontológico, WCAG AAA sin negro puro). El
   familiar lee cómodo e imprime el Libro de Historias en A4 limpio. */
:root{
  --papel:#FAF7F2; --lino:#F2ECE1; --tinta:#252320; --suave:#4A4440;
  --salvia:#2E6F5E; --terracota:#B85D3B; --linea:#DED6C6;
}
*{box-sizing:border-box}
body{margin:0;padding:1.4rem .9rem;background:var(--papel);color:var(--tinta);
     font:20px/1.6 "Segoe UI",system-ui,sans-serif}
main{max-width:860px;margin:0 auto}
h1{font-size:1.6rem;margin:.2rem 0 .1rem}
h2{font-size:1.25rem;margin:1.6rem 0 .5rem;color:var(--salvia)}
.sub{color:var(--suave);margin:0 0 1.2rem;font-size:.95rem}
a{color:var(--salvia)}
.boton{display:inline-block;background:var(--salvia);color:var(--papel);
       padding:.7rem 1.3rem;border-radius:10px;font-weight:700;
       border:2px solid var(--salvia);cursor:pointer;font-size:1rem;
       margin:.2rem .4rem .2rem 0;text-decoration:none}
.boton.alt{background:transparent;color:var(--terracota);
           border-color:var(--terracota)}
.tarjeta{background:var(--lino);border:1px solid var(--linea);
         border-radius:14px;padding:1rem 1.2rem;margin:.8rem 0}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
         gap:.7rem;margin:.6rem 0}
.dato{background:var(--papel);border:1px solid var(--linea);border-radius:12px;
      padding:.8rem;text-align:center}
.dato .n{font-size:1.7rem;font-weight:800;color:var(--salvia);display:block}
.dato .etiqueta{font-size:.85rem;color:var(--suave)}
.semaforo{border-radius:14px;padding:1rem 1.2rem;margin:.8rem 0;
          border:2px solid var(--linea)}
.semaforo.ok{background:#E9F2EC;border-color:var(--salvia)}
.semaforo.alerta{background:#F7E9E2;border-color:var(--terracota)}
.historia{background:var(--papel);border-left:.45rem solid var(--salvia);
          border-radius:10px;padding:.7rem 1rem;margin:.5rem 0}
.historia .fid{font-size:.78rem;color:var(--suave)}
.privacidad{font-size:.85rem;color:var(--suave);border-top:1px solid var(--linea);
            margin-top:1.4rem;padding-top:.8rem}
.no-imprimir{display:block}
@media print{
  body{background:#fff;font-size:12pt;padding:0}
  .no-imprimir{display:none !important}
  .tarjeta,.semaforo,.historia{break-inside:avoid;border-color:#bbb}
  .historia{border-left-color:#888}
  h2{color:#333}
  a{color:#333}
}
</style>
</head>
<body>
<main>
  <div class="top no-imprimir" style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
    <span style="font-weight:800" data-i18n="fm_top">🏡 Datito · Panel de bienestar</span>
    <span style="margin-left:auto">
      <button class="boton" onclick="window.print()" data-i18n="fm_imprimir">🖨️ Imprimir libro</button>
      <a class="boton alt" id="volver" href="/" data-i18n="fm_volver">Volver</a>
    </span>
  </div>
  <h1 id="nombre">…</h1>
  <p class="sub" id="sub" data-i18n="fm_sub">Cómo está su familiar, de un vistazo y con respeto.</p>

  <div id="contenido"></div>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script>
const slug = new URLSearchParams(location.search).get("curso")
  || localStorage.getItem("datito-ultimo");
document.getElementById("volver").href = `/chat.html?curso=${encodeURIComponent(slug)}`;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fechaHumana(iso) {
  if (!iso) return t("fm_sin_conversacion");
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(langDatito() === "en" ? "en-GB" : "es-CL",
    {dateStyle:"long", timeStyle:"short"});
}
function plural(n, una, varias) { return n === 1 ? `${n} ${una}` : `${n} ${varias}`; }

async function cargar() {
  let f;
  try {
    f = await get(`/api/cursos/${encodeURIComponent(slug)}/familiar`);
  } catch (e) {
    document.getElementById("contenido").innerHTML =
      `<div class="semaforo alerta">⚠ ${esc(e.message)}</div>`;
    return;
  }
  document.getElementById("nombre").textContent = f.curso.nombre;
  document.title = t("fm_top") + " · " + f.curso.nombre;
  const p = f.pulso;
  const partes = [];
  partes.push(`<section class="tarjeta"><h2>${esc(t("fm_pulso"))}</h2><div class="rejilla">
    <div class="dato"><span class="n">${esc(p.racha_dias)}</span><span class="etiqueta">${esc(t("fm_dias"))}</span></div>
    <div class="dato"><span class="n">${esc(p.sesiones)}</span><span class="etiqueta">${esc(plural(p.sesiones, t("fm_sesion"), t("fm_sesiones")))}</span></div>
    <div class="dato"><span class="n">${esc(p.mensajes)}</span><span class="etiqueta">${esc(plural(p.mensajes, t("fm_mensaje"), t("fm_mensajes")))}</span></div>
    <div class="dato"><span class="n">${esc(p.recuerdos)}</span><span class="etiqueta">${esc(plural(p.recuerdos, t("fm_recuerdo"), t("fm_recuerdos")))}</span></div>
    <div class="dato"><span class="n">${esc(p.talleres_completados)}</span><span class="etiqueta">${esc(plural(p.talleres_completados, t("fm_taller"), t("fm_talleres")))}</span></div>
  </div>
  <p style="margin:.4rem 0 0">🕰️ ${esc(t("fm_ultima"))} <b>${esc(fechaHumana(p.ultima_interaccion))}</b></p></section>`);

  const a = f.alertas;
  if (a.total === 0) {
    partes.push(`<section class="semaforo ok">🟢 <b>${esc(t("fm_ok_t"))}</b>
      ${esc(t("fm_ok_p"))}</section>`);
  } else {
    const filas = a.items.map(x =>
      `<li>${esc(x.fecha || "—")} · ${esc(x.tipo || "bienestar")}</li>`).join("");
    partes.push(`<section class="semaforo alerta">🟠 <b>${esc(plural(a.total, t("fm_alerta"), t("fm_alertas")))}.</b>
      ${esc(t("fm_alertas_nota"))}<ul>${filas}</ul></section>`);
  }

  const b = f.biografia;
  const caps = [];
  for (const [ent, items] of Object.entries(b.entidades)) {
    caps.push(`<h2>${esc(t("fm_sobre"))} ${esc(ent)}</h2>` +
      items.map(it => `<div class="historia">${esc(it.texto)}
        <div class="fid">[${esc(it.fid)}]</div></div>`).join(""));
  }
  if (b.otras.length) {
    caps.push(`<h2>${esc(t("fm_otras"))}</h2>` +
      b.otras.map(it => `<div class="historia">${esc(it.texto)}
        <div class="fid">[${esc(it.fid)}]</div></div>`).join(""));
  }
  if (!caps.length) caps.push(`<p>${esc(t("fm_sin_historias"))}</p>`);
  partes.push(`<section class="tarjeta"><h2>${esc(t("fm_libro"))}</h2>
    ${caps.join("")}</section>`);
  partes.push(`<p class="privacidad">🔒 ${esc(f.privacidad)}</p>`);
  document.getElementById("contenido").innerHTML = partes.join("");
}

cargar().catch(e => {
  document.getElementById("contenido").innerHTML =
    `<div class="semaforo alerta">⚠ ${esc(e.message)}</div>`;
});
</script>
</body>
</html>
