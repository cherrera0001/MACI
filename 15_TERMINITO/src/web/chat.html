<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat con tu Datito</title>
<link rel="stylesheet" href="/css/datito.css">
<style>
/* Modo compañía (D-11.2): alto contraste, tipografía grande, botón único.
   Solo se activa cuando el curso es modo == "compania". */
body.compania { font-size: 22px; background: #101418; color: #f2f5f7; }
body.compania .sub, body.compania p { color: #d7dee4; }
body.compania .msg { font-size: 22px; line-height: 1.5; }
body.compania .msg.tutor { background: #1d2b36; border-left: .5rem solid #4db6ff; }
body.compania .msg.estudiante { background: #243227; border-left: .5rem solid #7bd88a; }
body.compania .boton { font-size: 22px; padding: 1rem 1.6rem; }
body.compania textarea { font-size: 22px; }
#voz { display: none; font-size: 28px; padding: 1.2rem; border-radius: 1rem;
  border: 3px solid #4db6ff; background: #10344d; color: #fff; cursor: pointer; }
body.compania #voz { display: block; width: 100%; margin-bottom: .8rem; }
#voz:active, #voz.escuchando { background: #7a1f1f; border-color: #ff6b6b; }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="logo">🐜 <a href="/">Datito</a></span>
    <span>
      <a class="boton alt" style="padding:.35rem .7rem;font-size:.82rem" href="/eval.html" data-i18n="c_eval">Evaluarme</a>
      <a class="boton alt" style="padding:.35rem .7rem;font-size:.82rem" href="/panel.html" data-i18n="c_dominio">Dominio</a>
    </span>
    <span class="estado estado-motor"></span>
  </div>
  <h1 id="titulo">…</h1>
  <p class="sub" data-i18n="ch_sub">Cada afirmación del tutor lleva su fuente: tócala para ver el fragmento.</p>

  <div id="mensajes"></div>

  <div class="entrada">
    <button id="voz" type="button">🎤 Hablar (o escriba abajo)</button>
    <button id="recordar" class="boton alt" type="button" style="display:none">🧠 Recordar juntos</button>
    <textarea id="texto" rows="2" data-i18n-ph="ch_ph" placeholder="Pregunta lo que quieras del curso…"></textarea>
    <button class="boton" id="enviar" data-i18n="ch_enviar">Enviar</button>
  </div>
  <p style="font-size:.82rem;color:var(--suave)" data-i18n-html="ch_ayuda">
    <b>Registrar duda:</b> escríbela y usa el botón ✏️ que aparece junto a cada
    respuesta con fuente. Las dudas quedan en <code>dudas.yaml</code> con su procedimiento.
  </p>
</main>

<dialog id="visor">
  <div class="ref" id="visor-ref"></div>
  <pre id="visor-texto"></pre>
  <p><button class="boton alt" onclick="document.getElementById('visor').close()" data-i18n="cerrar">Cerrar</button></p>
</dialog>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script>
const slug = new URLSearchParams(location.search).get("curso")
  || localStorage.getItem("datito-ultimo");
const caja = document.getElementById("mensajes");
const texto = document.getElementById("texto");
let modoCompania = false;

/* Voz zero-dependency (D-11.2) con prioridad neuronal (D-12.1):
   1) POST /api/tts con motor neuronal local (piper) si existe;
   2) speechSynthesis con la mejor voz en español (Natural/Neural/es-CL…),
   frase a frase con pausas (rate 0.92);
   3) silencio si no hay nada: la conversación nunca se rompe. */
let modoCompania = false;
let vozNeuronal = false;
let vozElegida = null;
const vozDisponible = "speechSynthesis" in window;

function limpiarParaVoz(s) {
  return String(s || "").replace(/\[\w+#\d+\]/g, "").replace(/\s+/g, " ").trim();
}
function segmentar(s) {
  return limpiarParaVoz(s).match(/[^.!?;:]+[.!?;:]+["'”’]?|[^.!?;:]+$/g)
    ?.map(x => x.trim()).filter(Boolean) || [limpiarParaVoz(s)];
}
function elegirVoz() {
  if (!vozDisponible) return;
  const es = window.speechSynthesis.getVoices()
    .filter(v => v.lang.toLowerCase().startsWith("es"));
  const puntos = v => (/natural|neural|google|microsoft/i.test(v.name) ? 2 : 0)
    + (/es-cl|es-mx|es-ar/i.test(v.lang.toLowerCase()) ? 1 : 0);
  vozElegida = es.sort((a, b) => puntos(b) - puntos(a))[0] || null;
}
if (vozDisponible) {
  elegirVoz();
  window.speechSynthesis.onvoiceschanged = elegirVoz;
}
async function detectarVozNeuronal() {
  try {
    const s = await get("/api/salud");
    vozNeuronal = !!(s.voz && s.voz.neuronal);
  } catch { vozNeuronal = false; }
}
async function hablar(s) {
  if (!modoCompania || !s) return;
  if (vozNeuronal) {
    try {
      const r = await fetch(`/api/cursos/${slug}/tts`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto: limpiarParaVoz(s) }) });
      if (r.ok) {
        const a = new Audio(URL.createObjectURL(await r.blob()));
        a.play();
        return;
      }
    } catch { /* cae a voz del navegador */ }
  }
  if (!vozDisponible) return;
  window.speechSynthesis.cancel();
  for (const frase of segmentar(s)) {
    const u = new SpeechSynthesisUtterance(frase);
    u.lang = vozElegida?.lang || "es-ES";
    if (vozElegida) u.voice = vozElegida;
    u.rate = 0.92;   // prosodia pausada para adulto mayor
    window.speechSynthesis.speak(u);
  }
}
function configurarBotonVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const boton = document.getElementById("voz");
  if (!modoCompania) return;
  if (!SR) { boton.textContent = "🎤 (voz no disponible: escriba abajo)"; return; }
  const rec = new SR();
  rec.lang = "es-ES"; rec.interimResults = false;
  boton.onclick = () => {
    boton.classList.add("escuchando"); boton.textContent = "🎤 Escuchando…";
    rec.start();
  };
  rec.onresult = (e) => {
    texto.value = e.results[0][0].transcript;
    enviar();
  };
  rec.onend = () => {
    boton.classList.remove("escuchando");
    boton.textContent = "🎤 Hablar (o escriba abajo)";
  };
  rec.onerror = rec.onend;
}
async function recordarJuntos() {
  if (!modoCompania) return;
  const b = document.getElementById("recordar");
  b.disabled = true;
  try {
    const avance = document.querySelector("#recordar").dataset.abierto === "1";
    const r = await get(`/api/cursos/${slug}/reminiscencia${avance ? "" : "?nueva=1"}`);
    document.getElementById("recordar").dataset.abierto = "1";
    const div = burbuja("tutor", esc(r.pista));
    hablar(r.pista);
    if (r.completa) document.getElementById("recordar").dataset.abierto = "0";
  } catch (e) {
    burbuja("tutor", "⚠ " + esc(e.message));
  } finally {
    b.disabled = false;
  }
}

function burbuja(quien, html, extra = "") {
  const div = document.createElement("div");
  div.className = "msg " + quien;
  div.innerHTML = html + extra;
  caja.appendChild(div);
  div.scrollIntoView({ block: "end", behavior: "smooth" });
  return div;
}

function chipsDeEvidencia(evidencia) {
  if (!evidencia || !evidencia.length) return "";
  return '<div class="citas">' + evidencia.map(e =>
    `<button class="chip" data-fid="${esc(e.fid)}">[${esc(e.fid)}] ${esc(e.referencia)}</button>`
  ).join("") + "</div>";
}

async function enviar() {
  const pregunta = texto.value.trim();
  if (!pregunta) return;
  texto.value = "";
  burbuja("estudiante", esc(pregunta));
  const espera = burbuja("tutor", "<i>" + t("ch_pensando") + "</i>");
  try {
    const r = await post(`/api/cursos/${slug}/mensajes`, { texto: pregunta });
    espera.remove();
    const div = burbuja("tutor", esc(r.respuesta), chipsDeEvidencia(r.evidencia));
    hablar(r.respuesta);
    if (r.aviso) {
      const a = document.createElement("div");
      a.className = "aviso";
      a.textContent = r.aviso;
      div.appendChild(a);
    }
    const EJERCICIO = ["pista", "esperando_intento", "paso_mostrado"];
    if (EJERCICIO.includes(r.estado_interaccion)) {
      const s = document.createElement("div");
      s.className = "aviso";
      s.style.borderColor = "var(--azul)";
      s.style.color = "var(--azul)";
      s.textContent = "⟡ " + r.estado_interaccion +
        (r.paso ? ` · paso ${r.paso.numero}/${r.paso.total}` : "");
      div.appendChild(s);
    }
    if (r.evidencia && r.evidencia.length) {
      const b = document.createElement("button");
      b.className = "chip";
      b.style.borderColor = "var(--ambar)";
      b.style.color = "var(--ambar)";
      b.textContent = t("ch_duda");
      b.onclick = async () => {
        b.disabled = true;
        try {
          await post(`/api/cursos/${slug}/dudas`, { texto: pregunta });
          b.textContent = t("ch_duda_ok");
        } catch (e2) { b.textContent = "✗ " + e2.message; }
      };
      div.querySelector(".citas")?.appendChild(b);
    }
  } catch (e) {
    espera.remove();
    burbuja("tutor", "⚠ " + esc(e.message));
  }
}

document.getElementById("enviar").addEventListener("click", enviar);
texto.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
});

caja.addEventListener("click", async (e) => {
  const fid = e.target.dataset && e.target.dataset.fid;
  if (!fid) return;
  const d = document.getElementById("visor");
  document.getElementById("visor-ref").textContent = fid;
  document.getElementById("visor-texto").textContent = t("cargando");
  d.showModal();
  try {
    const f = await get(`/api/cursos/${slug}/fragmento?fid=${encodeURIComponent(fid)}`);
    document.getElementById("visor-ref").textContent =
      `[${f.fid}] ${f.fuente} · ${f.referencia}`;
    document.getElementById("visor-texto").textContent = f.texto;
  } catch (err) {
    document.getElementById("visor-texto").textContent = err.message;
  }
});

(async () => {
  pintarEstado();
  try {
    const c = await get(`/api/cursos/${slug}`);
    document.getElementById("titulo").textContent = c.curso.nombre;
    document.title = "Datito · " + c.curso.nombre;
    if (c.curso.modo === "compania") {
      // Presencia activa (D-11.1 + D-11.2): el compañero abre la conversación
      document.body.classList.add("compania");
      modoCompania = true;
      configurarBotonVoz();
      document.getElementById("recordar").style.display = "block";
      document.getElementById("recordar").onclick = recordarJuntos;
      detectarVozNeuronal();
      try {
        const a = await get(`/api/cursos/${slug}/apertura`);
        let bienvenida = a.saludo;
        if (a.recuerdo) {
          bienvenida += " " + a.recuerdo.texto + " ¿Cómo sigue eso hoy?";
        }
        burbuja("tutor", esc(bienvenida));
        hablar(bienvenida);
      } catch { /* sin apertura no pasa nada: la conversación sigue normal */ }
    }
  } catch {
    burbuja("tutor", t("ch_no_curso"));
  }
  texto.focus();
})();
</script>
</body>
</html>
