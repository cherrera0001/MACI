# Backlog MACI · Gestión con GitHub Projects
# Versión: 1.0 · Fecha: 2026-09-27
# Taxonomía: Sección 4 del Prompt Maestro v2
# Responsable: A2 (PO Asistente)

epicas:
  - id: E-1
    nombre: "[E-1] Establecer una fuente única de verdad del curso"
    resultado: "El manifiesto es uno solo, todas las rutas existen, índice y web usan la misma fuente"
    origen: ["H-01", "H-02", "H-10", "H-12"]
    metricas:
      - "0 archivos duplicados (clases.yaml, curriculum.yaml, grafo.yaml, dudas.yaml)"
      - "0 rutas rotas en manifiesto"
      - "100% de clases apuntan a visuales existentes"
    riesgos:
      - "Elegir el manifiesto equivocado (ADR-004 debe decidir)"
      - "Migración sin preservar git history"
    historias:
      - id: H-1.1
        titulo: "[H-1.1] Como mantenedor, quiero un solo manifiesto de clases, para que índice y web no se contradigan"
        criterios:
          - "Dado el repo, cuando busco clases.yaml, entonces existe exactamente uno"
          - "Dado el manifiesto, cuando corro test_manifiesto.py, entonces todas las rutas apuntan a archivos existentes"
          - "Dado el repo, cuando corro CI, entonces index.html se regenera desde el manifiesto"
        tareas:
          - id: T-1.1.1
            titulo: "Comparar 4 pares de YAML duplicados"
            descripcion: "diff clases.yaml, curriculum.yaml, grafo.yaml, dudas.yaml entre raíz y 00_INICIO"
            horas: 2
          - id: T-1.1.2
            titulo: "Ejecutar ADR-004 para elegir el manifiesto canónico"
            descripcion: "Decidir cuál mantener (versión larga en 00_INICIO o corta en raíz) con criterios"
            bloqueado_por: ["T-1.1.1"]
            horas: 1
          - id: T-1.1.3
            titulo: "Fusionar el manifiesto elegido y eliminar copias"
            descripcion: "git mv + edición final + cleanup"
            bloqueado_por: ["T-1.1.2"]
            horas: 2
          - id: T-1.1.4
            titulo: "Escribir test_manifiesto.py y agregarlo a CI"
            descripcion: "Validador: todas las rutas de visuales existen"
            bloqueado_por: ["T-1.1.3"]
            horas: 3

      - id: H-1.2
        titulo: "[H-1.2] Como estudiante, quiero que el número de clase coincida con el archivo, para no perderme"
        criterios:
          - "Dado un archivo 05_*.html, cuando busco su clase en el manifiesto, entonces encuentra exactamente una"
          - "Dado el manifiesto, cuando verifico, entonces clase.n == numero en archivo"
        tareas:
          - id: T-1.2.1
            titulo: "Generar tabla ruta declarada → archivo real"
            descripcion: "Mostrar discrepancias de numeración"
            horas: 2
          - id: T-1.2.2
            titulo: "Decidir: renombrar archivos o editar manifiesto"
            descripcion: "ADR-004 debe tomar esta decisión"
            bloqueado_por: ["T-1.2.1"]
            horas: 1
          - id: T-1.2.3
            titulo: "Aplicar cambios (renombra o edición según decisión)"
            descripcion: "Preservar git history con git mv"
            bloqueado_por: ["T-1.2.2"]
            horas: 3

      - id: H-1.3
        titulo: "[H-1.3] Como PO, quiero que el estado del proyecto se calcule solo, para no publicar cifras contradictorias"
        criterios:
          - "Dado el manifiesto, cuando ejecuto README.md.build.py, entonces README muestra % de avance real"
          - "Dado el repo, cuando se fusiona un PR, entonces el estado se actualiza"
        tareas:
          - id: T-1.3.1
            titulo: "Crear script que genera README.md y ESTADO.md desde manifiesto"
            descripcion: "Calcula: clases totales, clases con visual, clases completas, % cobertura"
            bloqueado_por: ["T-1.1.3"]
            horas: 3
          - id: T-1.3.2
            titulo: "Agregar GitHub Action que regenera estado en cada push"
            descripcion: ".github/workflows/actualizar-estado.yml"
            horas: 2

      - id: H-1.4
        titulo: "[H-1.4] Como ingeniero, quiero test_fuente_unica.py pasando, para verificar garantía G14"
        criterios:
          - "Dado el repo, cuando corro test_fuente_unica.py, entonces sale exitoso"
          - "Dado una modificación al manifiesto, cuando corre CI, entonces el test falla si se rompen garantías"
        tareas:
          - id: T-1.4.1
            titulo: "Escribir test: no existen duplicados de YAML"
            horas: 2
          - id: T-1.4.2
            titulo: "Escribir test: todas las rutas existen"
            horas: 2
          - id: T-1.4.3
            titulo: "Escribir test: cada clase apunta a exactamente un visual"
            horas: 1

