# Configuración de prioridades (se establece en F1 Gate)

prioridades:
  critica:
    - E-1
    - E-4
  alta:
    - E-2
    - E-3
  media:
    - E-5
    - E-6
    - E-7

# Bloques de dependencia entre épicas

dependencias:
  E-4: "E-4 debe estar hecho primero (CI protege todo lo demás)"
  E-1:
    - bloqueado_por: "E-4"
      razon: "Necesita CI verde antes de tocar manifiesto"
  E-2:
    - bloqueado_por: "E-1"
      razon: "No puedo reorganizar sin manifiesto canónico"
  E-3:
    - bloqueado_por: "E-1, E-2"
      razon: "Necesita manifiesto y arquitectura limpios"
  E-6:
    - bloqueado_por: "E-1, E-2, E-3, E-4, E-5"
      razon: "Los issues de gestión se crean DESPUÉS de que exista el backlog"
  E-7:
    - bloqueado_por: "E-6"
      razon: "El curso de gestión se enseña DURANTE la ejecución de F3"
