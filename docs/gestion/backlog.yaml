epicas:

  # ───────────────────────────────────────────────────────────── E-1 Curso
  - id: E-1
    titulo: "Curso: las 23 clases se estudian completas, sin conexión y fieles a la fuente"
    area: curso
    proceso: P1
    prioridad: P1
    v1: true
    resultado: >-
      Un alumno abre el índice, recorre las 23 clases en orden y en cada una
      encuentra objetivo, ficha Bloom, activación, contenido con cita y cierre.
      Nada depende de la red y ninguna cifra contradice el material del profesor.
    contexto: |
      - 23 clases en 6 unidades, definidas en `07_DATITO/clases.yaml`. 22 tienen visual; la clase 19 tiene `visual: null`.
      - Historia: el Sprint 01 «Lectura» (#1, #2 y #3 a #13) recuperó la piel de 11 visuales que se leían como texto plano. La restauración del 2026-09-27 (#26) devolvió cierres, dudas y ficha Bloom. #20 dejó el Certamen 3 como clase 23.
      - Los certámenes 1 y 2 se reescribieron como guía de estudio (commit b58ef1f).
    metricas:
      - "23 de 23 clases con `visual:` en `clases.yaml`"
      - "`probar_visuales_offline.py`: 23 de 23 páginas sin errores, sin red y sin desborde a 390 y 1280 px"
      - "`test_curso_integro.py`: 0 enlaces rotos, 0 relleno, cierre en cada clase"
    historias:
      - id: H-1.1
        titulo: "Como estudiante, quiero la clase 19 «Repaso integrado: el proyecto Melbourne» construida, para cerrar el curso aplicando todo sobre un solo caso"
        prioridad: P1
        v1: true
        contexto: |
          Es la única clase sin visual (`n: 19`, unidad 6, tipo repaso, `visual: null`). El README la declara pendiente desde la restauración.
          El caso existe en el repo: `08_PROYECTO_FCD/Hito1/`, `09_RESULTADOS/resultados_temporal.json` y `09_RESULTADOS/06_ENTREGABLES/`.
          Lecciones que aplican: VIZ-FAIL-001 (partir del template), VIZ-FAIL-002 y VIZ-FAIL-010 (cifras fieles a la fuente), VIZ-FAIL-014 (ningún contenedor con id sin guion que lo escriba).
        criterios:
          - "Dado `clases.yaml`, cuando leo la clase 19, entonces `visual:` apunta a un archivo que existe"
          - "Dado el visual, cuando lo abro sin red a 390 y 1280 px, entonces no hay errores de consola, peticiones de red ni desborde"
          - "Dada cada cifra del proyecto Melbourne en la página, cuando la busco en `09_RESULTADOS/`, entonces coincide y lleva su etiqueta de fuente"
          - "Dado el cierre de la clase, cuando lo leo, entonces tiene qué aprendiste, qué no confundir, procedimiento y pregunta final con respuesta oculta"
          - "Dado el repo, cuando corro `verificar_todo.py --navegador --en-linea`, entonces dice LISTO con 23 clases construidas"
        tareas:
          - id: T-1.1.1
            titulo: "Escribir el guion del repaso: qué concepto de cada unidad se aplica en Melbourne y con qué cifra"
            detalle: "Entregable: lista de secciones, cada una con el concepto (id de `curriculum.yaml`), la cifra y el archivo de `09_RESULTADOS/` de donde sale. Sin guion no se abre el HTML."
          - id: T-1.1.2
            titulo: "Construir el visual de la clase 19 desde `_TEMPLATE_CANONICO.html` con `/datito-visual`"
            detalle: "Una corrida del loop: `datito_loop_once.py --path <html> --hypothesis ... --lesson-id ...`. KEEP solo con `keep_eligible=true` y lectura comprobada en navegador."
          - id: T-1.1.3
            titulo: "Declarar el visual en `clases.yaml`, regenerar la navegación y pasar la verificación completa"
            detalle: "`construir_navegacion.py`, luego `verificar_todo.py --navegador --en-linea`. Actualizar en el README «22 están construidas»."

      - id: H-1.2
        titulo: "Como estudiante, quiero un glosario del curso, para encontrar cada término en la clase donde se enseña"
        prioridad: P2
        v1: false
        contexto: |
          El curso no tiene glosario. Hay un glosario de referencia de un curso de Google (unos 420 términos en inglés) en `11_GOOGLE/`, carpeta local sin versionar: sirve como lista de control, no como texto a copiar.
          Todo término nuevo tiene que salir del material del profesor y citar la clase, igual que el resto del curso.
        criterios:
          - "Dado el glosario de referencia, cuando lo cruzo contra las 23 clases, entonces queda una lista de términos del curso con la clase donde aparece cada uno y otra de términos que el curso no nombra"
          - "Dado el glosario del curso, cuando abro un término, entonces enlaza a la clase y ancla donde se enseña"
          - "Dado el glosario, cuando busco texto copiado de la referencia, entonces no hay: cada definición está en español y con la fuente del curso"
        tareas:
          - id: T-1.2.1
            titulo: "Cruzar el glosario de referencia contra las 23 clases y listar cobertura y ausencias"
            detalle: "Requiere un mapa inglés → español de los términos pertinentes. Entregable: tabla en `07_DATITO/06_AUDITORIAS/`."
          - id: T-1.2.2
            titulo: "Redactar el glosario del curso con enlace a clase y fuente, y sumarlo al generador"
            detalle: "Fuente única en YAML bajo `07_DATITO/`; la página la genera `construir_navegacion.py`."

  # ──────────────────────────────────────────────────────────── E-2 Datito
  - id: E-2
    titulo: "Datito: el tutor lleva al alumno de NO_ESTUDIADO a DOMINADO con evidencia"
    area: datito
    proceso: P2
    prioridad: P1
    v1: false
    resultado: >-
      Cada concepto del currículo tiene un estado respaldado por lo que el alumno
      explicó, aplicó, interpretó y transfirió. Datito pregunta, espera la
      respuesta y registra; nunca simula la respuesta.
    contexto: |
      - Skills: `/datito` (sesión socrática), `/datito-corregir`, `/datito-progreso`, `/datito-pedagogia`, `/datito-visual`. Contrato en `00_INICIO/spec.md` (garantías G1 a G14), comprobado por `verificar_contrato.py`: 12 ok, 0 fallos.
      - Estado al 2026-09-27 (`07_DATITO/estado.md`): 3 sesiones; 1 concepto COMPRENDIDO, 2 con comprensión parcial, 1 en estudio y 17 sin estudiar, de 21.
      - 15 clases del profesor transcritas en `05_CLASES/transcripciones/` y citadas con marca de tiempo.
    metricas:
      - "Conceptos con evidencia E·A·I·T completa, de 21"
      - "Errores conceptuales abiertos en `errores_conceptuales.yaml`"
      - "`verificar_contrato.py`: 0 fallos"
    historias:
      - id: H-2.1
        titulo: "Como alumno, quiero recorrer los 21 conceptos con Datito hasta tener evidencia de explicar, aplicar, interpretar y transferir, para dominar el curso y no memorizarlo"
        prioridad: P1
        v1: false
        contexto: |
          Solo `train_validation_test` está COMPRENDIDO (evidencia E y A). `generalizacion` y `overfitting_underfitting` tienen comprensión parcial. `regresion` está en estudio. Los otros 17 conceptos no se han estudiado.
          Hay un error abierto, `diagnostica_sin_calcular_la_brecha`, en overfitting. El siguiente concepto recomendado por `datito_estado.py` es `generalizacion`.
          Esta historia la avanza el alumno en sesiones `/datito`; un agente no puede cerrarla por él.
        criterios:
          - "Dado un concepto, cuando Datito lo marca DOMINADO, entonces `progreso.yaml` tiene las cuatro evidencias con la respuesta escrita por el alumno"
          - "Dado un error en `errores_conceptuales.yaml`, cuando se cierra, entonces hay una respuesta posterior del alumno que ya no lo comete"
          - "Dada una sesión, cuando termina, entonces `datito_estado.py` regenera `estado.md` y hay una entrada en `07_BITACORA/`"
          - "Unidad 1 (4 conceptos) · Unidad 2 (regresión) · Unidad 3 (4 conceptos) · Unidad 4 (4 conceptos) · Unidad 5 (8 conceptos): cada unidad se marca aquí al quedar COMPRENDIDA o mejor"
        tareas:
          - id: T-2.1.1
            titulo: "Cerrar el error abierto `diagnostica_sin_calcular_la_brecha` en una sesión `/datito`"
            detalle: "El alumno clasificó tres modelos sin restar train y validación. Se cierra cuando resuelve una tabla nueva calculando la brecha antes de nombrar el diagnóstico."
          - id: T-2.1.2
            titulo: "Llevar `generalizacion` y `overfitting_underfitting` de comprensión parcial a COMPRENDIDO"
            detalle: "Es el siguiente concepto que recomienda `datito_estado.py`. Falta evidencia de aplicar."

      - id: H-2.2
        titulo: "Como mantenedor, quiero que `historias_usuario.yaml` describa las 23 clases vigentes, para que ninguna historia cite una clase o un concepto que no existe"
        prioridad: P1
        v1: true
        contexto: |
          `07_DATITO/historias_usuario.yaml` tiene 18 historias (US-01 a US-18) escritas para una numeración de 18 clases que ya no existe: hoy son 23 y el orden cambió (la clase 5 es regresión, no particionamiento).
          Cinco ids de concepto no están en `curriculum.yaml`: `ensambles`, `interpretacion`, `metricas_regresion`, `particionamiento_temporal` y `transferencia`.
          `00_INICIO/spec.md:35` y el README citan el archivo como fuente. Ningún test lo compara contra `clases.yaml`.
        criterios:
          - "Dado `historias_usuario.yaml`, cuando leo cada `clase:`, entonces existe en `clases.yaml` y el título corresponde"
          - "Dado cada `conceptos:`, cuando lo busco en `curriculum.yaml`, entonces existe"
          - "Dado el repo, cuando alguien desalinea los dos archivos, entonces `verificar_todo.py` falla y lo nombra"
        tareas:
          - id: T-2.2.1
            titulo: "Reescribir las historias contra las 23 clases y los 21 conceptos vigentes"
            detalle: "Una historia por clase de tipo concepto y una por repaso. Conservar los criterios de aceptación que sigan siendo ciertos; no inventar los que falten."
          - id: T-2.2.2
            titulo: "Añadir la comprobación historias ↔ clases ↔ currículo a los tests"
            detalle: "Un test en `04_CODIGO/` que falle con el archivo actual y pase tras T-2.2.1. Actualizar las cifras en README y `spec.md`."

      - id: H-2.3
        titulo: "Como alumno, quiero las 15 clases transcritas como fuentes de NotebookLM, para consultar el curso completo con cita a la clase"
        prioridad: P2
        v1: false
        contexto: |
          `05_CLASES/indice_clases.yaml` tiene 15 clases; 10 siguen con `notebooklm: null`.
          El 2026-09-21 la sesión de NotebookLM estaba caducada: `auth check` respondía ok y `source list` fallaba. El inicio de sesión es interactivo y lo hace el dueño de la cuenta.
        criterios:
          - "Dado `indice_clases.yaml`, cuando cuento `notebooklm: null`, entonces es 0"
          - "Dado el cuaderno, cuando listo las fuentes, entonces ninguna clase está duplicada"
        tareas:
          - id: T-2.3.1
            titulo: "Renovar la sesión de NotebookLM y comprobarla con `source list`"
            detalle: "`notebooklm login --browser msedge`. La hace el dueño de la cuenta."
          - id: T-2.3.2
            titulo: "Subir las 10 transcripciones pendientes con `integrar_clase.py`, sin duplicar"
            detalle: "Listar antes las fuentes del cuaderno. `python 03_SCRIPTS/integrar_clase.py` sin `--sin-subir`."

  # ──────────────────────────────────────────────────────── E-3 Plataforma
  - id: E-3
    titulo: "Plataforma: una fuente de datos, un generador, una verificación y una publicación"
    area: plataforma
    proceso: P3
    prioridad: P1
    v1: true
    resultado: >-
      Cada dato del curso vive en un solo YAML, las páginas se generan desde ahí,
      un solo comando dice si el repo está listo y a maci.c4a.cl sube solo el curso.
    contexto: |
      - Historia: restauración del 2026-09-27 en seis fases. #24 fuente única en `07_DATITO/*.yaml`, #25 generador de navegación, #27 publicación sin enlaces rotos, #28 verificación automática, #29 documentación con datos medidos. Los PR #21 y #22 trajeron el paquete de scripts y el CI.
      - Hoy: `verificar_todo.py --navegador --en-linea` dice LISTO (26 tests; 23 de 23 páginas en Edge; sitio en vivo con 0 rotos y 0 privados expuestos).
    metricas:
      - "`verificar_todo.py --navegador --en-linea` → LISTO"
      - "CI verde en `main`"
      - "0 archivos privados accesibles en maci.c4a.cl"
    historias:
      - id: H-3.1
        titulo: "Como mantenedor, quiero que `auditar_drift_documental.py` audite las rutas que existen hoy, para que su fallo signifique algo"
        prioridad: P2
        v1: true
        contexto: |
          El script sale con 1 y lista 5 rutas «canónicas» que la reorganización movió o eliminó: `06_ENTREGABLES/INFORME_MODELO_FCD_P3.md`, `06_ENTREGABLES/PITCH_HITO2_REVISION.md`, `07_DATITO/00_LEEME.md`, `spec.md` y `.mcp.json`.
          No forma parte de `verificar_todo.py`, así que hoy falla sin que nadie lo vea.
        criterios:
          - "Dado el repo en `main`, cuando corro `python 03_SCRIPTS/auditar_drift_documental.py`, entonces sale con 0"
          - "Dada una ruta de la lista, cuando la borro, entonces el script falla y la nombra"
          - "Dada la decisión de conservarlo, cuando corro `verificar_todo.py`, entonces incluye esta auditoría; si se decide retirarlo, se archiva en `10_ARCHIVO/`"
        tareas:
          - id: T-3.1.1
            titulo: "Corregir la lista de rutas canónicas contra el disco (o archivar el script)"
            detalle: "`06_ENTREGABLES/` vive en `09_RESULTADOS/06_ENTREGABLES/`; `spec.md` en `00_INICIO/spec.md`."
          - id: T-3.1.2
            titulo: "Sumar la auditoría de rutas a `verificar_todo.py`"
            detalle: "Una línea más en `pasos`. Solo si T-3.1.1 conserva el script."

      - id: H-3.2
        titulo: "Como mantenedor, quiero que las cifras del README se comprueben contra la fuente, para no publicar un estado que ya cambió"
        prioridad: P2
        v1: false
        contexto: |
          El README declara a mano «23 clases», «22 están construidas», «21 conceptos», «6 dudas», «18 historias» y «15 clases transcritas». Ningún test las compara con los YAML.
          El 2026-10-01 las cifras del curso coinciden; la de historias describe un archivo desalineado (ver H-2.2).
        criterios:
          - "Dada una cifra del README, cuando cambia el YAML del que sale, entonces un test falla y dice cuál"
          - "Dado el test, cuando corre en CI, entonces no necesita red"
        tareas:
          - id: T-3.2.1
            titulo: "Test que compara las cifras del README con `clases.yaml`, `curriculum.yaml`, `dudas.yaml` e `indice_clases.yaml`"
            detalle: "En `04_CODIGO/test_curso_integro.py` o junto a él. Sin generar el README: solo comprobarlo."

  # ─────────────────────────────────────────────────── E-4 Learning Loop
  - id: E-4
    titulo: "Agents Learning Loop: cada fallo de construcción deja una lección que el siguiente agente lee"
    area: loop
    proceso: P4
    prioridad: P1
    v1: true
    resultado: >-
      Un agente que construye o repara una página lee antes los fallos pasados,
      trabaja con una hipótesis y un archivo, mide con un gate fijo y deja la
      decisión keep o discard con su lección. No se afinan pesos: mejora el repo.
    contexto: |
      - Vive en `07_DATITO/07_BITACORA/learning_loop/`: `program_loop.md` (protocolo), `agent_lessons.yaml` (16 fallos y 3 aciertos), `results.tsv` (una fila por corrida) y `contrato_conocimiento.yaml`.
      - Historia: los skills #14 a #19 (validador, clasificador, fixers, QA, colector) salieron de los sprints 03 a 06. #23 fijó que nada se publica sin pasar el gate.
      - Lección de fondo (VIZ-FAIL-015): el score certifica la piel de la página, no que el control funcione ni que el alumno aprenda.
    metricas:
      - "Lecciones archivadas en la lista de su id: 19 de 19 (`test_learning_loop.py`)"
      - "Filas de `results.tsv` con una lección que existe: todas"
      - "Fallos repetidos tras tener lección: 0"
    historias:
      - id: H-4.1
        titulo: "Como agente constructor, quiero encontrar todos los fallos en `failure_patterns`, para no repetir uno que ya tiene lección"
        prioridad: P1
        v1: true
        contexto: |
          `program_loop.md` manda leer `failure_patterns` primero. El 2026-10-01, 12 de las 15 lecciones de fallo colgaban de `keep_patterns`: cada lección nueva se había pegado al final del archivo, y el final era esa lista. Quien seguía el protocolo veía 3 fallos.
          Resuelto en la rama `docs/gestion-github-v1`: se reagrupó el archivo sin cambiar ninguna lección y se añadió `04_CODIGO/test_learning_loop.py`, que corre en `verificar_todo.py` y en CI. Quedó como VIZ-FAIL-016 con su fila en `results.tsv`.
        criterios:
          - "Dado `agent_lessons.yaml`, cuando leo `failure_patterns`, entonces están todos los ids `-FAIL-` y ningún `-KEEP-`"
          - "Dada una lección archivada en la lista equivocada, cuando corre `test_learning_loop.py`, entonces falla y la nombra"
          - "Dada una fila de `results.tsv`, cuando leo su `lesson_id`, entonces existe en `agent_lessons.yaml`"
          - "Dado el espejo `.agents/skills`, cuando difiere de `.claude/skills`, entonces el test falla"
        tareas: []

      - id: H-4.2
        titulo: "Como mantenedor, quiero que una corrida del loop no pueda registrarse con una lección que no le corresponde, para confiar en `results.tsv`"
        prioridad: P2
        v1: false
        contexto: |
          `04_CODIGO/datito_loop_once.py:61` asigna `VIZ-KEEP-001` a todo keep y `VIZ-FAIL-001` a todo discard cuando no se pasa `--lesson-id`. La primera fila de `results.tsv` es un discard etiquetado `VIZ-KEEP-001`.
          Las lecciones VIZ-FAIL-011 a 015 se escribieron sin fila en `results.tsv`: el protocolo («no declarar sin fila nueva») no se cumplió y nada lo detectó.
        criterios:
          - "Dada una corrida sin `--lesson-id`, cuando termina, entonces la fila queda con el id vacío o el script lo exige; nunca con un id por defecto"
          - "Dada una lección nueva, cuando no hay fila en `results.tsv` que la cite, entonces `test_learning_loop.py` lo avisa para las lecciones posteriores al 2026-10-01"
        tareas:
          - id: T-4.2.1
            titulo: "Quitar los ids por defecto de `datito_loop_once.py` y exigir `--lesson-id` al registrar"
            detalle: "Una función, un test. No reescribir las filas históricas."
          - id: T-4.2.2
            titulo: "Test: cada lección fechada después del 2026-10-01 tiene al menos una fila en `results.tsv`"
            detalle: "Las lecciones 011 a 015 quedan exentas por fecha; no se inventan filas."

      - id: H-4.3
        titulo: "Como mantenedor, quiero que el gate del loop compruebe que el control cambia lo que promete, para que keep no signifique solo «tiene la piel»"
        prioridad: P2
        v1: false
        contexto: |
          `datito_loop_eval.py` da `keep_eligible` con score 1.0, marcador de template y cero CDN. VIZ-FAIL-014 y VIZ-FAIL-015 documentan páginas con ese score y un recuadro vacío o un botón que no cambiaba nada. VIZ-FAIL-013: el validador estático no ve lo que cambia un slider.
          `contrato_conocimiento.yaml` ya declara, por página, qué control mover y qué texto debe cambiar (`comprobar`).
        criterios:
          - "Dada una página con control en el contrato, cuando corre el gate, entonces mueve el control en un navegador real y compara el texto antes y después"
          - "Dado un contenedor con id que ningún guion escribe, cuando corre el gate, entonces la decisión es discard"
          - "Dado el gate nuevo, cuando evalúa las 23 páginas actuales, entonces el resultado queda en `results.tsv` como línea base"
        tareas:
          - id: T-4.3.1
            titulo: "Llevar la comprobación de `contrato_conocimiento.yaml` (Playwright) dentro de `datito_loop_once.py`"
            detalle: "Reusar `verificar_piel_lectura.py` y `probar_visuales_offline.py`; no escribir un tercer verificador."

      - id: D-4.4
        tipo: decision
        titulo: "¿Se versiona `.agents/skills` como espejo de `.claude/skills` o se ignora?"
        prioridad: P2
        v1: true
        contexto: |
          `.agents/skills/` apareció el 2026-09-30 sin versionar. Es copia exacta de los 16 skills de `.claude/skills/`. `.codex/` y `.cursor/` sí están versionados.
          `test_learning_loop.py` ya falla si el espejo diverge, donde exista.
        opciones:
          - "Versionarlo: otros agentes (Codex, Cursor) leen los mismos skills; cuesta mantener dos copias, que el test vigila."
          - "Ignorarlo en `.gitignore`: una sola copia en el repo; cada máquina genera su espejo."
        criterios:
          - "Dada la decisión, cuando corro `git status`, entonces `.agents/` no aparece como sin seguimiento"
        tareas: []

