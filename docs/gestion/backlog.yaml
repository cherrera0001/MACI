  # ────────────────────────────────────────────────────────── E-6 Gobernanza
  - id: E-6
    titulo: "Gobernanza: el repositorio público muestra solo lo que debe y el trabajo se sigue en GitHub"
    area: gobernanza
    proceso: P5
    prioridad: P0
    v1: true
    resultado: >-
      Lo que está en el repo público es lo que se decidió publicar. El trabajo se
      planifica y se cierra en el Project con evidencia, y quien llega entiende
      cómo opera leyendo la wiki.
    contexto: |
      - El repositorio es público. El sitio maci.c4a.cl publica solo el curso, pero el repo versiona además progreso de estudio, notas personales, transcripciones de clases y laboratorios del ramo.
      - Historia: #23 detuvo la publicación de la reorganización del Prompt Maestro v2 hasta pasar el gate. Ese plan dejó 7 épicas en un YAML que nunca se importó (`docs/gestion/historico/`) y 5 ramas sin fusionar.
      - Desde el 2026-10-01 el backlog vive en los issues del Project #3, con campos Tipo, Prioridad y Proceso.
    metricas:
      - "Decisión de visibilidad tomada y ejecutada"
      - "0 ramas huérfanas"
      - "Todo issue abierto tiene tipo, prioridad, proceso y, salvo las épicas, un padre"
    historias:
      - id: D-6.1
        tipo: decision
        titulo: "¿Qué queda versionado en el repositorio público: datos personales, transcripciones y material del ramo?"
        prioridad: P0
        v1: true
        contexto: |
          Pendiente desde la restauración del 2026-09-27. El repo es público y versiona 856 archivos, entre ellos el progreso y los errores del alumno, una carpeta de notas personales, 15 transcripciones de clases con voces de terceros y los laboratorios del ramo con solución.
          `.gitignore` ya excluye videos, PDF y el examen del Certamen 3. `11_GOOGLE/` (glosario de un curso de Google e imagen) está en disco sin versionar y no debe subirse.
          Quitar un archivo de `main` no lo borra del historial: eso exige reescribir el historial, que es irreversible para quien ya clonó.
        opciones:
          - "Repo privado: se conserva todo; el sitio sigue público. El Project y la wiki dejan de verse desde fuera."
          - "Repo público limpio: lo personal y lo de terceros sale a un repo privado aparte; se decide si además se reescribe el historial."
          - "Dejarlo como está, por escrito, con la lista de lo que se acepta exponer."
        criterios:
          - "Dada la decisión, cuando queda escrita en este issue, entonces nombra qué carpetas se quedan y cuáles salen"
          - "Dada la opción elegida, cuando se ejecuta, entonces `verificar_todo.py --navegador --en-linea` sigue diciendo LISTO"
          - "Dado `11_GOOGLE/`, cuando corro `git status`, entonces está ignorado"
        tareas:
          - id: T-6.1.1
            titulo: "Inventariar lo personal y lo de terceros que está versionado, con ruta y tamaño"
            detalle: "Entregable: tabla en este issue. Solo lectura."
          - id: T-6.1.2
            titulo: "Ignorar `11_GOOGLE/` en `.gitignore`"
            detalle: "Material de terceros: no se versiona en ninguna de las tres opciones."
          - id: T-6.1.3
            titulo: "Ejecutar la opción elegida"
            detalle: "Bloqueada por la decisión. Reescribir historial o cambiar la visibilidad solo con confirmación escrita del dueño."

      - id: H-6.2
        titulo: "Como mantenedor, quiero el Project con épicas, historias y tareas enlazadas y con tipo, prioridad y proceso, para ver de un vistazo qué falta y por qué"
        prioridad: P1
        v1: true
        contexto: |
          Hasta el 2026-10-01 el Project #3 tenía 27 issues cerrados sin jerarquía común y un solo campo, Status. Las plantillas de issue pedían etiquetas `tipo:*` que no existían.
          Hecho el 2026-10-01 con `03_SCRIPTS/crear_backlog.py`: etiquetas `tipo:`, `area:` y `prioridad:`; campos Tipo, Prioridad y Proceso; 6 épicas con sus historias y tareas como sub-issues; los issues históricos colgados de su épica; milestone v1.0; milestones anteriores cerrados.
          Lo que la API no permite y queda a mano: las vistas del tablero y los flujos automáticos.
        criterios:
          - "Dado un issue abierto, cuando lo abro en el Project, entonces tiene Tipo, Prioridad y Proceso, y un padre si no es épica"
          - "Dado el Project, cuando abro la vista «Por épica», entonces agrupa por Parent issue y muestra el avance de sub-issues"
          - "Dado un issue que se cierra, cuando miro el tablero, entonces pasa a Done sin moverlo a mano"
        tareas:
          - id: T-6.2.1
            titulo: "Crear las vistas del Project: Por épica, Tablero por estado, v1.0 y Por proceso"
            detalle: "En la interfaz (la API no crea vistas). Configuración exacta en la wiki, página «Cómo opera el tablero»."
          - id: T-6.2.2
            titulo: "Activar los flujos automáticos del Project: auto-agregar issues del repo y pasar a Done al cerrar"
            detalle: "Project → Workflows. Sin esto, cada issue nuevo hay que agregarlo a mano."
          - id: T-6.2.3
            titulo: "Decidir si el Project #3 pasa a público"
            detalle: "Hoy es privado y el README lo cita como seguimiento: quien no es el dueño no puede abrirlo."

      - id: H-6.3
        titulo: "Como persona que llega al repo, quiero una wiki que explique qué es MACI, cómo opera el tablero y los conceptos de GitHub Projects, para orientarme sin preguntar"
        prioridad: P1
        v1: true
        contexto: |
          La wiki estaba desactivada. Se activó el 2026-10-01 y sus páginas se escriben en `docs/wiki/` (fuente única, revisable por PR). `03_SCRIPTS/publicar_wiki.sh` las copia al repositorio de la wiki.
          GitHub no crea el repositorio de una wiki hasta que alguien guarda la primera página desde la web; ese paso es manual y es uno solo.
        criterios:
          - "Dada la wiki, cuando abro Home, entonces enlaza a: qué es MACI y Datito, procesos, cómo opera el tablero, conceptos de GitHub Projects y pendientes"
          - "Dado un cambio en `docs/wiki/`, cuando corro `publicar_wiki.sh`, entonces la wiki queda igual que la carpeta"
          - "Dada cada cifra de la wiki, cuando la comparo con el repo, entonces coincide o enlaza a donde se mide"
        tareas:
          - id: T-6.3.1
            titulo: "Guardar la primera página desde la web y publicar `docs/wiki/` con `publicar_wiki.sh`"
            detalle: "https://github.com/cherrera0001/MACI/wiki → «Create the first page» → Save. Después: `bash 03_SCRIPTS/publicar_wiki.sh`."

      - id: H-6.4
        titulo: "Como mantenedor, quiero el repo sin ramas huérfanas, para que una rama abierta signifique trabajo en curso"
        prioridad: P2
        v1: true
        contexto: |
          Quedan 5 ramas del Prompt Maestro v2: `fix/01-yaml-unicos`, `fix/02-rutas-visual`, `fix/05-herramientas-unicas`, `fix/08-generar-index-simple` y `feat/11-ci-minimo`. Tres están también en el remoto.
          La restauración del 2026-09-27 resolvió por otra vía lo que intentaban. Borrarlas es irreversible en el remoto, así que antes se comprueba que no tengan nada que `main` no tenga.
        criterios:
          - "Dada cada rama, cuando comparo con `main`, entonces queda anotado en este issue si tiene commits propios y qué contienen"
          - "Dadas las ramas sin nada que rescatar, cuando termino, entonces no existen ni en local ni en el remoto"
        tareas:
          - id: T-6.4.1
            titulo: "Comparar las 5 ramas contra `main` y anotar qué tiene cada una"
            detalle: "`git log main..<rama> --oneline` y `git diff main...<rama> --stat`. Solo lectura."
          - id: T-6.4.2
            titulo: "Borrar las ramas sin contenido propio, en local y en el remoto"
            detalle: "Con la confirmación del dueño en el issue."
