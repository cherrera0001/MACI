# Backlog de MACI · semilla de los issues del Project #3
#
# Este archivo es la SEMILLA con la que 03_SCRIPTS/crear_backlog.py creó los
# issues el 2026-10-01. Desde ese día manda GitHub: el estado, los comentarios
# y el cierre de cada ítem viven en el issue, no aquí. Se edita este archivo
# solo para sembrar ítems nuevos (el script es idempotente: no duplica títulos).
#
# Jerarquía: épica [E-n] → historia [H-n.m] o decisión [D-n.m] → tarea [T-n.m.p]
# Cada cifra de «contexto» se midió en el repo el 2026-10-01.
#
# El backlog anterior (7 épicas del Prompt Maestro v2, nunca importado) está en
# historico/backlog_prompt_maestro_v2.yaml.

repo: cherrera0001/MACI
project: 3

milestone:
  titulo: "v1.0 · Curso completo y verificable"
  descripcion: >-
    Primera versión de MACI. Las 23 clases construidas (falta la 19), el tablero
    ordenado en épicas, historias y tareas, la memoria del Learning Loop legible
    y la decisión sobre qué se publica tomada. Se cierra cuando
    `python 03_SCRIPTS/verificar_todo.py --navegador --en-linea` dice LISTO con
    las 23 clases y no queda ningún ítem P0 o P1 abierto en este milestone.

