name: CI

on:
  push:
  pull_request:
    branches: [qa, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Run tests
      run: python -m unittest discover -s 04_CODIGO -p "test_*.py" -v

    - name: Verificar todo (generador, contrato, citas, tests)
      run: python 03_SCRIPTS/verificar_todo.py
