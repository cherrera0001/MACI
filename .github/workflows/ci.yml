name: CI

on:
  push:
  pull_request:
    branches: [qa, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 15_TERMINITO/pyproject.toml exige >=3.12 (requires-python)
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # deps declaradas en 15_TERMINITO/pyproject.toml (la sonda de
        # comportamiento ejecuta el paquete del zip con estas importaciones)
        pip install pyyaml jinja2 markdown pypdf

    - name: Run tests
      run: python -m unittest discover -s 04_CODIGO -p "test_*.py" -v

    - name: Verificar todo (generador, contrato, citas, tests)
      run: python 03_SCRIPTS/verificar_todo.py
