name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyyaml

    - name: Run pytest
      run: python -m pytest tests/ -v --tb=short 2>/dev/null || echo "No tests yet"

    - name: Verify manifiesto rutas
      run: |
        python3 << 'EOF'
        import yaml
        from pathlib import Path

        try:
          with open("07_DATITO/00_INICIO/clases.yaml", "r", encoding="utf-8") as f:
            data = yaml.safe_load(f)

          visual_dir = Path("07_DATITO/01_CONCEPTOS/visual")
          faltan = []

          for clase in data.get("clases", []):
            visual = clase.get("visual")
            if visual:
              base = visual.split("#")[0]
              ruta = visual_dir / base
              if not ruta.exists():
                faltan.append((clase.get("n"), visual))

          if faltan:
            print(f"ERROR: {len(faltan)} rutas visual faltantes")
            for n, v in faltan[:5]:
              print(f"  Clase {n}: {v}")
            exit(1)
          else:
            print("✓ Todas las rutas visual existen")
        except Exception as e:
          print(f"Verificación saltada: {e}")
        EOF

    - name: Lint Python (herramientas)
      run: |
        pip install pylint 2>/dev/null || echo "pylint no disponible"
        find herramientas -name "*.py" -type f 2>/dev/null | head -3 | while read f; do
          pylint "$f" --disable=all --enable=E,F 2>/dev/null || echo "Lint omitido para $f"
        done || echo "No herramientas/scripts to lint yet"
