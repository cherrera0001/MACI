    summary: "Visual de certamen generado con diseño ajeno al template Datito"
    evidence:
      - "07_DATITO/visual/certamen3_p1a_roc_detallado.html usó Chart.js vía cdn.jsdelivr.net"
      - "Gradiente púrpura #667eea → #764ba2 (look genérico AI), no tokens :root Datito"
