# --- Inbox: hipótesis pendientes (las llenan errores del alumno o fallos de build) ---

  - id: VIZ-KEEP-003
    date: "2026-09-26"
    family: visual
    summary: "Recuperar la piel por visual conservando la lección y sus controles"
    evidence:
      - "evidence/sprint01/03_eda/: antes/después, controles y browser.json offline a 1280 y 390 px"
      - "evidence/sprint01/04_limpieza_preparacion/: .repreg oscura, fuentes menores, fórmulas y controles legibles"
      - "04_limpieza_preparacion baseline: gate 1.0 pese head roto y etiquetas sin estilo; baseline-browser.json lo detecta"
    keep_rule: >
      La lectura renderizada decide: no basta el score. Restituir head desde el
      template, cerrar comentario antes de title y conservar un solo root.
      Conservar cuerpo real y scripts; quitar solo cola placeholder demostrada.
      Recuperar CSS específico del propio concepto y acotar estilos de navegación
      (nav.pasos, .leccion .barra) para no romper listas ni widgets.
      Comprobar capturas, estilos aplicados, controles y móvil offline con
      verificar_piel_lectura.py además del gate existente. Si una clase no existe
      en el cuerpo, verificar su equivalente real sin inventar contenido.
    metric_gate: "datito_loop_eval.py y verificar_piel_lectura.py, más inspección visual y controles"

  - id: VIZ-FAIL-005
    date: "2026-09-26"
    family: visual
    summary: "Byte 0x01 reemplazó </style> causando que h1 quede dentro de style abierto"
    evidence:
      - "05_train_validation_test.html, 07_generalizacion.html, 11_matriz_confusion.html, 19_deep_learning.html: h1 no renderizaba"
      - "verificar_piel_lectura.py reportaba 'Un solo h1' como error (count === 1 fallaba, era 0)"
      - "Causa: byte 0x01 en posición de </style> dejaba el estilo abierto, h1 dentro de style, nunca en DOM"
    root_cause: "File encoding corruption: 0x01 byte replaced closing tag during migration"
    keep_rule: >
      Error 'Un solo h1' NO significa 'múltiples h1', significa count ≠ 1.
      Puede ser 0 (h1 dentro de <style> abierto) o 2+ (duplicados).
      Reparación: solo reemplazar 0x01 → </style>. Prohibido borrar h1.
      Prohibido envolver tablas en .table-wrapper como primer paso de diagnosis.
      JSON del validador es fuente de verdad (ok, failures), no agent summary.
    metric_gate: "Byte integrity check en migraciones; verificar_piel_lectura.py ok=true"

  - id: VIZ-FAIL-006
    date: "2026-09-26"
    family: visual
    summary: "Comentario de reglas nunca se cierra, deja title/root/main/h1 fuera"
    evidence:
      - "triaje_de_problemas.html, certamen_1.html, certamen_2.html, clase6_regresion.html"
      - "<!-- datito:template:v1 --> abre; reglas en comentario; cierre en <!-- datito:nav:inicio -->"
      - "Resultado: title, :root, h1, main quedan comentados. Bloque fake template queda al final"
    root_cause: "Comment nesting error: rules block opener never closed before nav marker"
    keep_rule: >
      Cerrar comentario de reglas ANTES de <title>.
      Pegar :root y todos los estilos del template canónico (líneas 19-94).
      Abrir </head><body><main> ANTES de <!-- datito:nav:inicio -->.
      Cortar bloque fake (segundo h1 'TÍTULO DEL CONCEPTO...') al final.
      Si falta script del concepto, copiar UNA VEZ desde 10_ARCHIVO (sin :root).
      Si ok≠true tras editar, no revertir HEAD cerrado; pegar failures y dejar archivo.
    metric_gate: "verificar_piel_lectura.py: un :root, un h1, uno </html>, zero TÍTULO DEL CONCEPTO"

  - id: VIZ-FAIL-007
    date: "2026-09-26"
    family: deployment
    summary: "Ruta /(.*) status:404 en vercel.json causa 404 falso en archivos existentes"
    evidence:
      - "vercel.json routes: [{src:'/(.*)', status:404, dest:'/index.html'}]"
      - "Efecto: https://maci-rose.vercel.app/ y cualquier .html devuelven 404 aunque existan"
      - "Sitio estático NO necesita catch-all 404. Vercel sirve archivos directamente."
    root_cause: "Cargo-cult SPA configuration (Next.js style routing) aplicado a static site"
    keep_rule: >
      Static sites NO llevan rutas con status:404.
      Solo definir rutas si hay reescrituras o redirects especiales (e.g., trailing slash).
      Prohibido catch-all (.*) con status 404.
      Usar: {src:'^/$', dest:'/index.html'} SOLO si hay un root redirect necesario.
    metric_gate: "GET https://maci-rose.vercel.app/ → 200; GET /.../archivo.html → 200 (no 404)"

  - id: VIZ-FAIL-008
    date: "2026-09-26"
    family: visual
    summary: "Estructura rota + scripts incompletos: agentes arreglan piel pero falta código de dibujo"
    evidence:
      - "08_overfitting_underfitting.html, 09_regresion.html: estructura cerrada ✓, pero función updateGrafico() missing"
      - "Agente add listener → listener está ahí pero updateGrafico() no existe (90% del script falta)"
      - "Validador: ok=false (3 errores cada uno): 2x sliders rotos + 1x mobile overflow"
    root_cause: >
      Archivos migrados sin scripts completos. La estructura piel se puede arreglar, pero
      los dibujos (canvas, SVG, cálculos) requieren ~300+ líneas de JS no presentes.
    keep_rule: >
      Antes de añadir listeners, verificar que la función destino existe.
      Si el archivo está >50% incompleto (falta función principal), marcar BLOQUEADO
      y no intentar Wave 2. Buscar script en archivo de referencia (10_ARCHIVO) o escalate.
    metric_gate: "verificador_visual.py: buscar 'undefined function' o que listeners llamen a función que NO existe"

  - id: VIZ-FAIL-009
    date: "2026-09-26"
    family: visual
    summary: "Regresión por listeners sin función: Wave 1 fija estructura, Wave 2 listener suma errores"
    evidence:
      - "#08: Wave 1 removió bloque fake → ok pasó; Wave 2 added listener → ok volvió a FAIL (3 errores)"
      - "#09: Wave 1 removió fake → ok pasó; Wave 2 added 2 listeners → ok FAIL (3 errores)"
      - "Causa: listeners llamando updateGrafico() que no existe → console error → validador marca como JS broken"
    root_cause: >
      Sequential waves assumed independencia: Wave 1 arregla piel, Wave 2 arregla listeners.
      Pero si la función no existe, Wave 2 introduce regresión (listener que llama nada).
    keep_rule: >
      En Wave 2, si vas a añadir listeners, PRIMERO verificar que la función destino existe
      buscando su definición en el archivo ANTES de editar. Si no existe, reportar BLOQUEADO
      y pedir script completo, no continuar con ediciones.
    metric_gate: "verificador_visual.py detecta JS error cuando listener llama función undefined"

  - id: VIZ-FAIL-010
    date: "2026-09-26"
    family: visual
    summary: "Certificaciones (examen) requieren gráficos precisos contra PDF, no placeholders temporales"
    evidence:
      - "certamen_3.html tenía SVG mínimo con 3 puntos ROC en lugar de 7"
      - "Tabla confusión: 3 filas en lugar de 7; datos inconsistentes con PDF"
      - "Histograma: placeholder texto en lugar de SVG bimodal"
    root_cause: >
      Ediciones previas no verificadas contra PDF original. Placeholders temporales
      nunca fueron reemplazados. SVG construido sin validar puntos contra tabla.
    keep_rule: >
      Antes de marcar [FIXED] en archivo de examen:
      1. Cada número en tabla → verificar contra PDF
      2. Cada eje/punto en SVG → calcular/transcribir de datos verificados
      3. Cada imagen → reconstruir desde PDF o detallar "aproximado"
      4. Re-validar archivo completo en navegador (no solo validador JSON)
    metric_gate: "verificador_visual.py + lectura manual en navegador a 1280px y 390px"

