  - id: VIZ-FAIL-002
    date: "2026-09-25"
    family: visual
    summary: "Segunda rotura: profundidad/diseño inconsistente tras 'listo' prematuro"
    evidence:
      - "certamen3_examen_fcd2026.html: details cortos sin puente figura→tabla"
      - "Tabla VP/FN/FP/VN inventada (FP=5 en α bajas) contradecía el PDF del examen"
      - "Usuario: 'se pierde, no logras explicar cómo a partir de estas imágenes llegaste a la tabla'"
    root_cause: >
      Optimizar cobertura P1–P3 en un solo pass sin checklist de profundidad
      ni lectura fiel de la figura del enunciado
    keep_rule: >
      Por subpregunta: Qué pasó (lectura de figura) + pasos + números del PDF
      + details + resp + errores + checklist. No KEEP si la tabla no sale de la figura.
    metric_gate: "bloques_profundidad == 6 por subpregunta; cifras contrastadas con PDF"

