# --- Keep rules (patrones que SÍ mejorarón) ---
keep_patterns:

  - id: VIZ-KEEP-001
    date: "2026-09-25"
    family: visual
    summary: "Añadir explicación figura→tabla sin rediseñar layout"
    evidence: "Usuario pidió no cambiar diseño; sí sumar explicación — funcionó"
    keep_rule: "Preferir insertar bloques .clave/.nota/.pasos dentro del template; no rehacer CSS"

  - id: VIZ-KEEP-002
    date: "2026-09-26"
    family: visual
    summary: "Migrar Plotly CDN → Canvas 2D local sin perder interactividad"
    evidence:
      - "simulador_prediccion_falla.html: Plotly remoto (https://cdn.plot.ly/)"
      - "Migrado a Canvas 2D con sliders, actualizaciones reactivas, grid + scatter"
      - "Score 0.5 → 1.0; pass gates offline_draw, anti_cdn"
    keep_rule: >
      Diagramas interactivos pueden migrarse de CDN a Canvas sin rediseño.
      Canvas es más controlable offline, pero perder librería (Plotly) requiere
      2-3h de reimplementación. Evaluar ROI por archivo crítico.
    metric_gate: "datito_loop_eval.py gates anti_cdn + offline_draw ambos PASS"

