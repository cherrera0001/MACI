# Lecciones Aprendidas — Loop Simulador Predicción de Falla

iteracion_1:
  hipotesis: "Scatter plot con controles de umbral permite entender relación Eje X → decisión de falla"
  cambios:
    - "Crear scatter plot con Plotly (31 puntos: 17 sin_falla, 14 con_falla)"
    - "Agregar sliders para vibración y temperatura (umbrales ajustables)"
    - "Calcular matriz confusión en vivo según umbrales"
    - "Mostrar 4 métricas derivadas (accuracy, precision, recall, F1)"
  resultado: "MEJORA ✅"
  leccion: |
    - CSS variables Datito (--tinta, --real-bg, --error-bg) funcionan para tablas HTML
    - Plotly scatter necesita container height explícito en CSS
    - Matriz confusión debe actualizarse antes de mostrar (orden: calc → display)
    - Usuarios entienden umbral visual mejor que ecuación (confirmado en especificación)
  fecha: "2026-09-25"
  archivo: "simulador_prediccion_falla.html"

iteracion_2:
  hipotesis: "Matriz confusión dinámica permite ver impacto de umbrales en cada celda"
  cambios:
    - "Reorganizar tabla: TP/TN/FP/FN en 4 celdas con labels destacados"
    - "Agregar colores dinámicos: intensidad = proporción relativa del valor"
    - "Verde (acierto) para TP/TN, Rojo (error) para FP/FN"
    - "Animación suave (transition .2s) al cambiar umbrales"
  resultado: "MEJORA ✅"
  leccion: |
    - Tabla HTML simple es 10x más efectiva que gráfico para matriz
    - Colores dinámicos (rgba intensity) permiten ver proporción sin cálculo manual
    - Separar labels (TP, FN, FP, TN) hace matriz autoexplicativa
    - Usuario comprende instantáneamente trade-off (TP vs FP al cambiar slider)
  fecha: "2026-09-25"
  archivo: "simulador_prediccion_falla.html"

