# Dudas resueltas con Datito, EN ORDEN CRONOLOGICO.
#
# Fuente unica de toda respuesta, resolucion o correccion que Datito da en una
# sesion. Nada de lo que se explica queda solo en la terminal: se escribe aqui y
# 03_SCRIPTS/construir_navegacion.py lo renderiza en cada visual listado en
# `visuales` (bloque «Dudas resueltas con Datito», entre los marcadores
# <!-- datito:dudas:inicio --> y <!-- datito:dudas:fin -->) y en el indice.
#
# Origen de la regla: 2026-09-21, tercera vez que una explicacion quedo solo en
# el chat. Ver spec.md G9 y la bitacora 2026-09-21.
#
# Campos
#   id            fecha-tema, unico. Es el ancla: visual.html#duda-<id>
#   fecha         de la sesion
#   sesion        bitacora donde quedo el contexto
#   conceptos     ids de curriculum.yaml
#   visuales      donde se renderiza (el primero es el principal)
#   estado        resuelta · practica (la pregunta se le dejo a el; respuesta oculta)
#                 · abierta (no se entrego respuesta en la sesion; aqui si esta)
#   pregunta      el enunciado, completo
#   respondio     lo que Cristobal dijo, textual (solo si respondio; nunca inventado: G1)
#   respuesta     la respuesta correcta en una frase
#   resolucion    los pasos
#   error_tipico  el error que el formato castiga
#   fuentes       con etiqueta G4
#
# Solo Datito escribe aqui. Tras editar: python 03_SCRIPTS/construir_navegacion.py

dudas:

  - id: 2026-09-18-baseline-mejora
    fecha: '2026-09-18'
    sesion: 07_DATITO/bitacora/2026-09-18-train_validation_test.md
    conceptos: [generalizacion, train_validation_test]
    visuales: [generalizacion.html, train_validation_test.html]
    estado: abierta
    pregunta: >-
      En Melbourne, el MAE de validación cruzada en 2016 y el de test en 2017 fueron:
      baseline (mediana) 449.160 → 431.649 (mejora 17.511); árbol de decisión
      219.821 → 246.568 (empeora 26.747); HistGradientBoosting 159.777 → 188.218
      (empeora 28.441). ¿Por qué el baseline mejora al pasar a 2017 mientras los
      modelos empeoran, y por qué el mejor modelo es el que más empeora?
    respondio: >-
      Intento 1: «entonces, podemos hablar de un sobreajuste». Intento 2: «el modelo
      fue entrenado con datos del 2016, pero un modelo que deberías validar, o que
      debería probar es gradient boosting, o random forest».
    respuesta: >-
      El baseline no aprendió nada de 2016 salvo un número (la mediana, 900.000),
      así que su error solo refleja qué tan dispersos están los precios del año que
      mide; los modelos aprendieron relaciones de 2016 que en 2017 valen menos, y
      además fueron elegidos mirando 2016, por eso el más ajustado a 2016 es el que
      más pierde.
    resolucion:
      - >-
        El baseline: predecir siempre 900.000 da MAE 449.122 sobre los precios de
        2016 y 431.649 sobre los de 2017 (este último es exactamente su MAE de test).
        Los precios de 2017 están algo menos dispersos alrededor de 900.000. La
        «mejora» es una propiedad de los datos, no del modelo.
      - >-
        Los modelos: aprendieron cómo se relacionan ubicación, tipo y tamaño con el
        precio EN 2016. En 2017 el 29,1 % de las propiedades están en suburbios que
        no existían en 2016: parte de lo aprendido ya no aplica (cambio de distribución).
      - >-
        El mejor es el que más empeora (HGB +17,8 %, 159.777 → 188.218; árbol +12,2 %):
        es el que más estructura fina de 2016 capturó, y además fue ELEGIDO por tener
        el menor error en 2016, así que su número de validación es optimista.
      - >-
        Así lo dijo el profesor al comentar este mismo proyecto: los datos «cambian
        un poco entre el 2016 y el 2017» y «también tomaron decisiones con ese
        subconjunto de datos», y lo llamó «un poquito sobreajustado a los datos del
        2016». Son dos mecanismos: optimismo por selección y cambio de distribución.
      - >-
        Por qué no basta decir «sobreajuste»: las dos columnas de la tabla son datos
        que el modelo no usó para entrenar. Sin nombrar el mecanismo, la etiqueta no
        explica por qué el baseline mejora.
    error_tipico: >-
      Poner la etiqueta «sobreajuste» sin mecanismo, o proponer otro modelo sin
      leer que la tabla ya contiene los resultados del propio proyecto.
    fuentes:
      - '[FUENTE · Repo: 09_RESULTADOS/resultados_temporal.json] MAE de CV 2016 y test 2017'
      - '[FUENTE · Repo: 02_DATOS/housing_dashai_2016_2017.csv + 09_RESULTADOS/dashai_split_indices.json] MAE de predecir 900.000: 449.122 (2016) y 431.649 (2017), calculado el 2026-09-21'
      - '[FUENTE · Repo: 05_CLASES/transcripciones/2026-09-04T22_05_05Z_Fundamentos_en_Ciencia_de_Datos.md · 2:08:49–2:09:16] comentario del profesor'
      - '[INFERENCIA] la descomposición en dos mecanismos'

  - id: 2026-09-19-brecha-abc
    fecha: '2026-09-19'
    sesion: 07_DATITO/bitacora/2026-09-19-overfitting_underfitting.md
    conceptos: [overfitting_underfitting]
    visuales: [overfitting_underfitting.html]
    estado: resuelta
    pregunta: >-
      Tres modelos con R² de entrenamiento / prueba: A 0,62 / 0,59 · B 0,98 / 0,54 ·
      C 0,41 / 0,39. a) ¿Cuál sobreajusta, cuál subajusta y cuál está bien?
      b) Un compañero dice que B es el mejor porque aprendió mejor los datos. ¿Tiene
      razón? c) ¿Qué harías para mejorar B?
    respondio: >-
      a) Primer intento: «A sobreajusta, B subajusta, C está bien». Segundo intento,
      tras calcular las brechas: B sobreajusta, C subajusta «porque ambos valores son
      bajos», A está bien. b) «Mi compañero no tiene razón, B memoriza pero generaliza
      peor que el modelo A». c) Regularizar y podar el árbol.
    respuesta: >-
      B sobreajusta (brecha 0,44), C subajusta (bajo en ambos, brecha 0,02), A está
      bien (bueno en ambos, brecha 0,03); el compañero se equivoca porque lo que
      importa es la prueba (A 0,59 > B 0,54).
    resolucion:
      - 'Paso 1, la brecha de cada uno: A 0,62−0,59 = 0,03 · B 0,98−0,54 = 0,44 · C 0,41−0,39 = 0,02.'
      - 'Paso 2, la brecha grande aísla el sobreajuste: B.'
      - 'Paso 3, entre los de brecha chica, el nivel separa: C es bajo en ambos → subajuste; A es aceptable en ambos → ajuste razonable.'
      - 'b) No: B memoriza el entrenamiento, pero en datos nuevos rinde menos que A. Ancla la respuesta con la cifra: 0,54 < 0,59.'
      - >-
        c) Remedios del curso: simplificar (menos grado, podar o limitar el árbol),
        más filas, y elegir la complejidad con validación cruzada. «Podar» supone que
        B es un árbol, y el enunciado no lo dice: declara el supuesto (P11).
        «Regularizar» no aparece en las clases del profesor ni en el P4: úsalo solo
        como [INFERENCIA].
    error_tipico: >-
      Clasificar mirando un solo número por modelo en vez de calcular la brecha
      primero; y dar remedios que suponen un tipo de modelo no declarado.
    fuentes:
      - '[FUENTE · Repo: 07_DATITO/bitacora/2026-09-19-overfitting_underfitting.md] problema y respuestas'
      - '[FUENTE · Repo: 07_DATITO/patron_evaluacion.md §7] procedimiento de diagnóstico'
      - '[FUENTE · Repo: 07_DATITO/errores_conceptuales.yaml] error diagnostica_sin_calcular_la_brecha'

  - id: 2026-09-19-mae-pqr
    fecha: '2026-09-19'
    sesion: 07_DATITO/bitacora/2026-09-19-overfitting_underfitting.md
    conceptos: [overfitting_underfitting]
    visuales: [overfitting_underfitting.html]
    estado: resuelta
    pregunta: >-
      Tres modelos de tiempo de entrega, métrica MAE (menos es mejor), entrenamiento /
      prueba: P 0,15 / 0,92 · Q 0,71 / 0,78 · R 1,84 / 1,90. a) ¿Cuál sobreajusta,
      cuál subajusta y cuál está bien?
    respondio: 'a) «P sobreajusta, Q está bien, R subajusta», sin ayuda.'
    respuesta: >-
      P sobreajusta (error muy bajo en entrenamiento y alto en prueba), R subajusta
      (error alto en ambos), Q está bien.
    resolucion:
      - 'Antes de restar, lee qué significa el número: con MAE, MENOS es mejor (al revés que R²).'
      - 'Brechas: P 0,92−0,15 = 0,77 · Q 0,78−0,71 = 0,07 · R 1,90−1,84 = 0,06.'
      - 'P tiene la brecha grande: sobreajuste. Entre Q y R, R tiene error alto en ambos: subajuste. Q: bajo y parecido en ambos.'
    error_tipico: >-
      Aplicar de memoria la regla de R² («más alto es mejor») a una métrica de error
      e invertir el diagnóstico.
    fuentes:
      - '[FUENTE · Repo: 07_DATITO/bitacora/2026-09-19-overfitting_underfitting.md] problema y respuesta'
      - '[FUENTE · Repo: 07_DATITO/patron_evaluacion.md §7] procedimiento de diagnóstico'

  - id: 2026-09-21-arbol-45cm
    fecha: '2026-09-21'
    sesion: 07_DATITO/bitacora/2026-09-21-regresion_generalizacion.md
    conceptos: [regresion, generalizacion]
    visuales: [clase6_regresion.html, generalizacion.html]
    estado: resuelta
    pregunta: >-
      Cortaste 20 árboles y ajustaste la recta: R² = 0,93. Tu jefe te pide predecir
      el peso de un árbol de radio 45 cm. Los 20 árboles tenían radios entre 8 y
      22 cm. ¿Le entregas la predicción? Justifica.
    respuesta: >-
      No como una predicción confiable: 45 cm está fuera del rango observado
      (8–22 cm), es una extrapolación; si se entrega, va con esa advertencia
      explícita, y lo correcto es medir árboles de ese tamaño.
    resolucion:
      - 'El rango de tus datos es 8–22 cm. 45 cm es más del doble del máximo: el modelo nunca vio un árbol así.'
      - 'R² = 0,93 mide el ajuste a los 20 árboles con que ajustaste la recta, todos dentro de 8–22 cm. No dice nada fuera de ese rango.'
      - >-
        El modelo igual devuelve un número. Con la recta de la página (θ₁ ≈ 9,72 kg
        por cm, θ₀ ≈ −6,9 kg): ŷ = −6,9 + 9,72·45 ≈ 430 kg. Tener un número no es
        tener evidencia.
      - >-
        El peso crece con el volumen (aprox. radio² × altura), más rápido que una
        recta: con árboles grandes la recta probablemente se queda corta.
      - 'Qué haces: entregas el número declarando la extrapolación y por qué no es confiable, o mides árboles grandes y vuelves a ajustar.'
      - >-
        Frase para la prueba: «No la entrego como confiable: 45 cm está fuera del
        rango observado (8–22 cm), así que es extrapolación. El R² de 0,93 mide el
        ajuste solo dentro de ese rango.»
    error_tipico: >-
      Creer que un R² alto autoriza a predecir en cualquier parte; el R² se calculó
      solo donde había datos.
    fuentes:
      - '[FUENTE · Repo: 05_CLASES/transcripciones/06Clase_Fundamentos_en_Ciencia_de_Datos_31_de_julio.md · 0:42:10] generalizar: funcionar para datos que no ha visto antes'
      - '[FUENTE · Repo: 07_DATITO/visual/clase6_regresion.html] los 20 árboles y la recta de mínimos cuadrados'
      - '[INFERENCIA] «extrapolación»: el profesor no usa esa palabra en las 14 transcripciones'
      - '[DATITO] el argumento físico del volumen'

  - id: 2026-09-21-theta0-theta1
    fecha: '2026-09-21'
    sesion: 07_DATITO/bitacora/2026-09-21-regresion_generalizacion.md
    conceptos: [regresion]
    visuales: [clase6_regresion.html]
    estado: resuelta
    pregunta: >-
      Un compañero dice: «si θ₁ es 82,13, entonces un árbol de radio cero pesaría
      82 kilos». ¿Tiene razón? Justifícalo nombrando qué símbolo responde esa pregunta.
    respuesta: >-
      No: el peso con radio cero lo da θ₀ (el intercepto), no θ₁; θ₁ es la
      pendiente, cuántos kilos sube el peso por cada centímetro más de radio.
    resolucion:
      - 'En ŷ = θ₀ + θ₁·x, con x = 0 queda ŷ = θ₀. El símbolo que responde es θ₀.'
      - 'θ₁ no es un peso: es kilos POR centímetro. Leerlo como peso confunde pendiente con intercepto.'
      - >-
        Con la recta de la página, θ₀ ≈ −6,9 kg: un peso negativo, imposible. Eso
        muestra lo segundo: radio 0 también está fuera de los datos (8–22 cm), así que
        ni siquiera θ₀ tiene interpretación física aquí.
      - >-
        Ojo con las cifras: 82,13 y 0,2588 son los coeficientes del P4 sobre datos
        sintéticos (make_regression), no de árboles. Con esas cifras, radio 0 daría
        0,26 kg; el razonamiento es el mismo.
      - >-
        Frase para la prueba: «No. "Cuánto pesa con radio cero" lo responde θ₀, no θ₁;
        θ₁ es cuánto aumenta el peso por centímetro. Y radio 0 está fuera de los datos,
        así que θ₀ no se interpreta físicamente.»
    error_tipico: 'Leer la pendiente como si fuera el valor de ŷ; interpretar θ₀ fuera del rango de los datos.'
    fuentes:
      - '[FUENTE · Repo: 07_DATITO/visual/clase6_regresion.html §7] la notación desarmada'
      - '[FUENTE · Repo: 06_LABORATORIOS/_markdown/2026_P4_Regresión_res.md] 82,13 y 0,2588 vienen de make_regression'
      - '[INFERENCIA] la lectura de θ₀ negativo como señal de extrapolación'

  - id: 2026-09-21-agronomo-lluvia
    fecha: '2026-09-21'
    sesion: 07_DATITO/bitacora/2026-09-21-regresion_generalizacion.md
    conceptos: [generalizacion, regresion]
    visuales: [generalizacion.html]
    estado: practica
    pregunta: >-
      (Transferencia) Un agrónomo ajustó una recta de rendimiento contra lluvia con
      datos entre 300 y 600 mm, y le piden predecir un año de 1.200 mm. ¿Qué le dices?
    respuesta: >-
      Que no la entregue como confiable: 1.200 mm está al doble del máximo observado,
      es una extrapolación; y en agronomía es esperable que el rendimiento deje de
      subir o caiga con exceso de agua, justo lo que una recta no puede mostrar.
    resolucion:
      - 'Reconoce el concepto sin que te lo nombren: es el mismo problema del árbol de 45 cm en otro dominio.'
      - 'Rango observado 300–600 mm; 1.200 mm está fuera: extrapolación.'
      - >-
        La recta sigue subiendo para siempre; el cultivo no: con exceso de agua hay
        anegamiento, enfermedades y lavado de nutrientes. Fuera del rango, la forma de
        la relación puede cambiar por completo.
      - 'Qué hacer: declarar la extrapolación, buscar datos de años muy lluviosos (o de otra zona con esa lluvia), o no entregar número.'
    error_tipico: 'Tratarlo como un problema nuevo en vez de reconocer la misma estructura (predicción fuera del rango).'
    fuentes:
      - '[DATITO] el caso y el argumento agronómico'
      - '[FUENTE · Repo: 05_CLASES/transcripciones/06Clase_Fundamentos_en_Ciencia_de_Datos_31_de_julio.md · 0:42:10] generalizar: datos que no ha visto antes'
