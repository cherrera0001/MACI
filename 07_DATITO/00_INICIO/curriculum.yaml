# Curriculum del tutor personal de Ciencia de Datos
#
# Archivo ESTATICO: define el plan de estudio. El tutor NO lo modifica.
# El avance se registra aparte, en progreso.yaml.
#
# material_local  -> rutas verificadas dentro de este repositorio
# sin_material_local: true -> depende de NotebookLM o fuentes externas

meta:
  alumno: Cristobal Herrera
  asignatura: Fundamentos de Ciencia de Datos (T2-2026)
  universidad: Universidad de Concepcion
  proyecto_ancla: Prediccion de precios de propiedades en Melbourne, 2016 -> 2017
  notebooklm:
    nombre: Fundamentals of Data Science Syllabus
    id: 97ce114e-2371-44eb-85b5-527cd28180cb
    url: https://notebook.google.com/notebook/97ce114e-2371-44eb-85b5-527cd28180cb
    # Inventario verificado el 2026-09-18 con: notebooklm source list
    total_fuentes: 66
    por_tipo: {web_page: 32, pdf: 29, docx: 3, markdown: 2}
    # Material de la asignatura y documentos UdeC presentes en el cuaderno.
    # Son la fuente PRIORITARIA: mandan sobre cualquier otra referencia.
    material_asignatura:
      - Syllabus Fundamentos de Ciencia de Datos.docx
      - FCD-2026-2_02_CienciaDeDatos.pdf
      - FCD-2026-2_03_CienciaDeDatosEnLaPractica.pdf
      - FCD-2026-2_04_CalidadDeDatos.pdf
      - FCD-2026-2_05_AnalisisExploratorio.pdf
      - FCD-2026-2_07_Clasificacion.pdf
      - FCD-2026-2_08_DL_LLMs_Agents.pdf
      - Resumen_Clase6_Regresion.pdf
      - Resumen_Clase8_DL_LLMs_Agentes.pdf
      - Guia_Autoestudio_Completa_Fundamentos_de_Ciencia_de_Datos.docx
      - Guia_Estudio_Potenciada_Fundamentos_Ciencia_de_Datos.docx
    documentos_udec:
      - DIPLOMA EN CIENCIA DE DATOS FUNDAMENTOS - Ingenieria UdeC
      - Deteccion de fraude transaccional mediante modelos de aprendizaje automatico (UdeC)
      - Edad de jubilacion en Chile, regresion lineal vs simbolica (UdeC)
      - Modelo predictivo interpretable de ingreso monetario con XGBoost y SHAP (UdeC)
      - Predecir la probabilidad de incumplimiento, regresion sobre el intervalo unitario (UdeC)
      - Deep Learning - Magister en Ciencias de la Computacion
    libros_y_papers:
      - Gareth James, Witten, Hastie, Tibshirani (ISLR) - Berkeley Statistics
      - OpenIntro Statistics
      - "XGBoost: A Scalable Tree Boosting System (arXiv)"
      - 50 Years of Data Science (Donoho)
      - FAIR Principles
      - Scikit-learn User Guide (model selection, model evaluation, learning curves)
    nota: >-
      Redes, deep learning, LLM y agentes no tienen codigo propio ejecutado por
      el alumno. Desde el 2026-09-21 sus laminas estan en texto local
      (11_PRESENTACION/_markdown/FCD-2026-2_08 y Resumen_Clase8, este ultimo
      hibrido con transcripcion) y la clase del 21-ago esta transcrita. El
      cuaderno de NotebookLM agrega el PDF de Deep Learning del Magister.

# Laboratorios de la asignatura. Fuente de PRIORIDAD 1 segun spec.md G5:
# es el tratamiento oficial del curso, manda sobre cualquier otra referencia.
#
# Cada practico tiene dos versiones:
#   res    resuelta, con salidas. Material de consulta.
#   vacio  enunciados sin resolver. EJERCICIOS REALES.
#
# Regla para Datito: los (vacio) son la fuente de evidencia de APLICAR.
# Resolver uno sin mirar el (res) es prueba genuina de comprension. NUNCA
# mostrarle la version resuelta de un ejercicio antes de que lo intente.
practicos:
  P1:
    nombre: Laboratorio Pandas
    res: "06_LABORATORIOS/[P1]Laboratorio_Pandas_(res).ipynb"
    vacio: "06_LABORATORIOS/2026_[P1]Laboratorio_Pandas_(vacio).ipynb"
    contenido: >-
      Series y DataFrames, acceso y modificacion, cargar y guardar, merge,
      describe, filtrar, operaciones, ordenar, groupby. 10 ejercicios.
    conceptos: [datos_features_target, eda]
  P2:
    nombre: Calidad de Datos
    res: "06_LABORATORIOS/2026_[P2]Calidad_de_Datos(res).ipynb"
    vacio: "06_LABORATORIOS/2026_[P2]Calidad_de_Datos(vacio).ipynb"
    contenido: >-
      Duplicados de filas y de indices, valores fuera de rango, valores
      faltantes (reemplazar frente a eliminar), datos no utiles,
      inconsistencias, tipos de dato incorrectos.
    conceptos: [limpieza_preparacion]
  P3:
    nombre: Numpy y Analisis Descriptivo
    res: "06_LABORATORIOS/2026_[P3]Numpy_+_Análisis_Descriptivo_(res).ipynb"
    vacio: "06_LABORATORIOS/2026_[P3]Numpy_+_Análisis_Descriptivo_(vacio).ipynb"
    contenido: >-
      Arreglos Numpy y conversion desde DataFrame. Analisis descriptivo:
      centralidad, extension, describe. Visualizacion con Matplotlib.
    conceptos: [eda]
  P4:
    nombre: Regresion
    res: "06_LABORATORIOS/2026_[P4]Regresión(res).ipynb"
    vacio: "06_LABORATORIOS/2026_[P4]Regresión(vacio).ipynb"
    contenido: >-
      Regresion lineal y construccion manual de la funcion desde los
      coeficientes. Metricas de evaluacion. Dataset California Housing de
      sklearn. Regresion polinomial. Validacion cruzada. SESGO Y VARIANZA.
    conceptos: [regresion, train_validation_test, validacion_cruzada, overfitting_underfitting]
    nota: >-
      El practico mas denso del programa. Su apartado de sesgo y varianza es la
      base teorica del fenomeno que ya se observo empiricamente en Melbourne.
  P5:
    nombre: Clasificacion
    res: "06_LABORATORIOS/2026_[P5]Clasificación(res) (1).ipynb"
    vacio: "06_LABORATORIOS/2026_[P5]Clasificación(vacio).ipynb"
    contenido: >-
      Codificacion de categoricas a mano, get_dummies y LabelEncoder. Concepto
      de clasificacion y significado de TP, TN, FP y FN. Modelos SVM con varios
      kernels, arbol de decision con visualizacion, y Random Forest.
    conceptos: [clasificacion, matriz_confusion, metricas_clasificacion, arboles_decision, random_forest]
    fuera_de_curriculum: >-
      SVM no esta entre los 21 conceptos del programa. Material disponible,
      pero no concepto a dominar.

# Cifras reales del proyecto Melbourne, para usarlas como ejemplo concreto.
# Verificadas en 09_RESULTADOS/resultados_temporal.json, clave "meta".
hechos_del_proyecto:
  filas_train_2016: 6336
  filas_test_2017: 7244
  features_numericas: [Rooms, Distance, Bedroom2, Bathroom, Car, Landsize, Lattitude, Longtitude, Propertycount]
  features_categoricas: [Type, Method, Regionname]
  excluidas: [Suburb, Postcode, Address, SellerG, CouncilArea, Date, BuildingArea, YearBuilt]
  target: Price
  pct_test_suburbio_nuevo: 29.11
  precio_mediana_2016: 900000.0
  precio_mediana_2017: 910000.0
  semillas: [0, 1, 2, 3, 4]
  modelo_final: HistGradientBoosting sobre log1p(Price)
  mae_2017: 188218
  r2_2017: 0.757
  modelos_comparados:
    - Baseline (mediana)
    - Ridge (lineal)
    - Arbol de decision
    - Random Forest
    - Gradient Boosting
    - HistGradientBoosting
  nota_targets: cada modelo fue evaluado dos veces, sobre Price crudo y sobre log1p(Price)

conceptos:

  - id: fundamentos_ciencia_datos
    nombre: Fundamentos de Ciencia de Datos
    orden: 1
    prerrequisitos: []
    por_que_importa: Define que problema resuelve un modelo, y cuando no hace falta ninguno.
    material_local:
      - 06_ENTREGABLES/INFORME_MODELO_FCD_P3.md
      - 01_DOCUMENTACION/02_CURSO/guia_fcd_texto.txt
    pregunta_diagnostico: >-
      Tu modelo predice el precio de una casa en Melbourne. Un tasador humano
      tambien lo hace. Que aporta el modelo que el tasador no, y que aporta el
      tasador que el modelo no?

  - id: datos_features_target
    nombre: Datos, filas, columnas, features y target
    orden: 2
    prerrequisitos: [fundamentos_ciencia_datos]
    por_que_importa: Sin separar feature de target no se puede razonar sobre fuga de informacion.
    material_local:
      - 02_DATOS/housing_dashai_2016_2017.csv
      - 09_RESULTADOS/resultados_temporal.json
    pregunta_diagnostico: >-
      En tu dataset de Melbourne, Price es el target y Rooms es una feature.
      Por que Date quedo excluida de las features, si es una columna con
      informacion real sobre cada venta?

  - id: eda
    nombre: Analisis exploratorio de datos (EDA)
    orden: 3
    prerrequisitos: [datos_features_target]
    por_que_importa: Es donde se detectan los problemas que despues arruinan el modelo.
    material_local:
      - 06_ENTREGABLES/visualizaciones/
      - 03_SCRIPTS/housing_visualizations.py
    pregunta_diagnostico: >-
      La mediana de precio fue 900.000 en 2016 y 910.000 en 2017. Que te dice
      ese numero sobre la dificultad de predecir 2017 con un modelo entrenado
      en 2016? Y que no te dice?

  - id: limpieza_preparacion
    nombre: Limpieza y preparacion de datos
    orden: 4
    prerrequisitos: [eda]
    por_que_importa: Decidir que columna se excluye es una decision de modelado, no de limpieza.
    material_local:
      - 03_SCRIPTS/preparar_dashai.py
      - 09_RESULTADOS/auditoria_dashai_vs_crudo.json
    pregunta_diagnostico: >-
      Excluiste BuildingArea y YearBuilt de tu modelo. Da una razon por la que
      excluir una columna con informacion util puede mejorar el resultado.

  - id: train_validation_test
    nombre: Train / validation / test
    orden: 5
    prerrequisitos: [datos_features_target]
    por_que_importa: >-
      El nucleo del proyecto. Tu split es temporal y no aleatorio, y esa
      eleccion decide todo lo demas.
    material_local:
      - 09_RESULTADOS/dashai_split_indices.json
      - 03_SCRIPTS/modelamiento_temporal.py
      - 10_ARCHIVO/_obsoleto_split_aleatorio/
    pregunta_diagnostico: >-
      Tienes dos versiones del mismo proyecto: una con split aleatorio que
      reportaba 81% y otra con split temporal 2016 a 2017. Cual mide mejor lo
      que de verdad importa, y por que la otra parecia mejor?

  - id: validacion_cruzada
    nombre: Validacion cruzada
    orden: 6
    prerrequisitos: [train_validation_test]
    por_que_importa: Permite elegir modelo sin tocar el conjunto de test.
    material_local:
      - 03_SCRIPTS/modelamiento_temporal.py
      - 09_RESULTADOS/resultados_temporal.json
    pregunta_diagnostico: >-
      Hiciste validacion cruzada dentro de 2016 y recien despues miraste 2017.
      Que habria pasado si eliges el modelo mirando directamente el resultado
      de 2017?

  - id: generalizacion
    nombre: Generalizacion
    orden: 7
    prerrequisitos: [train_validation_test]
    por_que_importa: >-
      El 29,1% de suburbios nuevos en el test es un caso real y medido de
      generalizacion dura.
    material_local:
      - 09_RESULTADOS/resultados_temporal.json
      - 09_RESULTADOS/comparacion_estadistica.json
    pregunta_diagnostico: >-
      El 29,1% de las propiedades de 2017 estan en suburbios que no aparecen en
      2016. Como puede tu modelo predecir el precio de una casa en un suburbio
      que nunca vio?

  - id: overfitting_underfitting
    nombre: Overfitting y underfitting
    orden: 8
    prerrequisitos: [generalizacion, validacion_cruzada]
    por_que_importa: >-
      Tienes 6 modelos de complejidad creciente ya medidos: la curva es
      observable en tus propios numeros, no teorica.
    material_local:
      - 09_RESULTADOS/resultados_temporal.json
      - 10_ARCHIVO/_obsoleto_split_aleatorio/
    pregunta_diagnostico: >-
      Un arbol de decision sin limitar acierta casi perfecto en train y falla en
      test. Un baseline de mediana falla parecido en ambos. Cual sobreajusta,
      cual subajusta, y como los distingues solo mirando esos dos numeros?

  - id: regresion
    nombre: Regresion
    orden: 9
    # Corregido el 2026-09-20. Antes declaraba overfitting_underfitting como
    # prerrequisito, y esta al reves: el profesor enseña regresion en la Clase 6
    # e introduce el sobreajuste DENTRO de ella, via regresion polinomial. El
    # error lo expuso el grafo conceptual al hacerse recorrible.
    prerrequisitos: [datos_features_target]
    por_que_importa: Es tu proyecto. MAE 188.218 AUD y R2 0,757 son tus propias cifras.
    material_local:
      - 06_ENTREGABLES/INFORME_MODELO_FCD_P3.md
      - 09_RESULTADOS/predicciones_2017.csv
      - 03_SCRIPTS/bootstrap_comparacion.py
    pregunta_diagnostico: >-
      Tu MAE en 2017 es 188.218 AUD sobre una mediana de 910.000. Es bueno o
      malo? Defiende la respuesta con un argumento que no sea "depende".

  - id: clasificacion
    nombre: Clasificacion
    orden: 10
    prerrequisitos: [regresion]
    por_que_importa: "Cambia la naturaleza del error: ya no existe cerca, hay acierto o fallo."
    material_local:
      - 08_PROYECTO_FCD/Desafio/REPORT.md
      - 08_PROYECTO_FCD/Desafio/src/
    pregunta_diagnostico: >-
      En Galaxy Zoo clasificas 3 clases: ambigua, espiral y eliptica. Por que no
      puedes usar MAE aqui, si tambien podrias restar numeros de clase?

  - id: matriz_confusion
    nombre: Matriz de confusion
    orden: 11
    prerrequisitos: [clasificacion]
    por_que_importa: Es la fuente de la que salen accuracy, precision, recall y F1.
    material_local:
      - 08_PROYECTO_FCD/Desafio/REPORT.md
      - 08_PROYECTO_FCD/Desafio/src/04_class0_analysis.py
      - 07_DATITO/casos_estudio/cancer_mama/matriz_confusion_interpretacion_RESUELTO.md
      - 07_DATITO/casos_estudio/cancer_mama/preinforme_hito2_v02.pdf
    casos_estudio:
      - cancer_mama: "Diagnóstico de cáncer de mama: 114 pacientes, 72 benignos + 42 malignos. Matriz real de Random Forest con interpretación de TP, TN, FP, FN. Vinculación a tu pregunta de certamen sobre doctor y 1000 pacientes."
    pregunta_diagnostico: >-
      En tu matriz de Galaxy Zoo, que celda dice cuantas galaxias espirales
      fueron clasificadas como elipticas? Y por que ese error puede importar mas
      que el inverso? Ahora: en el caso del cáncer, ¿qué error es más grave:
      los 3 falsos negativos o los 0 falsos positivos? ¿Por qué?

  - id: metricas_clasificacion
    nombre: Accuracy, precision, recall y F1
    orden: 12
    prerrequisitos: [matriz_confusion]
    por_que_importa: La metrica oficial de tu desafio es F1-macro y no accuracy. Esa eleccion tiene motivo.
    material_local:
      - 08_PROYECTO_FCD/Desafio/REPORT.md
      - 08_PROYECTO_FCD/Desafio/src/05_decision_rule.py
      - 07_DATITO/casos_estudio/cancer_mama/matriz_confusion_interpretacion_RESUELTO.md
      - 07_DATITO/casos_estudio/cancer_mama/preinforme_hito2_v02.pdf
    casos_estudio:
      - cancer_mama: "Cálculo de accuracy (0.974), precision (1.000), recall (0.929), FPR (0.000) desde la matriz real de Random Forest. Comparación con SVM (0.965 acc, 0.905 recall) y Decision Tree (0.939 acc, 0.881 recall). Por qué balanced accuracy ganó sobre accuracy simple."
    pregunta_diagnostico: >-
      La metrica oficial de Galaxy Zoo es F1-macro y no accuracy. Que problema
      concreto de ese dataset hace que accuracy sea enganosa? En cáncer de mama,
      ¿por qué recall importa más que accuracy? ¿Es mejor detectar 39 de 42
      malignos (recall 0.929) o tener 0 falsos positivos (precision 1.000)?

  - id: roc_auc
    nombre: ROC y AUC
    orden: 13
    prerrequisitos: [metricas_clasificacion]
    prioritario: true
    por_que_importa: >-
      Vacio ya identificado por escrito: el expediente del Certamen 2 marca la
      pregunta 9 (cifras de AUC) como no evidenciada.
    material_local:
      - 08_PROYECTO_FCD/Desafio/REPORT.md
      - 01_DOCUMENTACION/01_CERTAMEN2/03_DEFENSA_ORAL_CERTAMEN.md
      - 07_DATITO/casos_estudio/cancer_mama/preinforme_hito2_v02.pdf
      - 07_DATITO/casos_estudio/cancer_mama/Presentacion_Hito2_v2_2.pdf
    casos_estudio:
      - cancer_mama: "Curvas ROC de tres modelos (SVM 0.991 AUC, Random Forest 0.995 AUC, Decision Tree 0.922 AUC) calculadas sobre el mismo test reservado de 114 pacientes. Visualización de TPR vs FPR y por qué ROC-AUC ordena observaciones mejor que accuracy en desbalance de clases."
    pregunta_diagnostico: >-
      Un modelo tiene AUC 0,90 y accuracy 0,60. Otro tiene AUC 0,70 y accuracy
      0,85. Es posible? Si lo es, que mide cada metrica que la otra no?
      En cáncer de mama, Random Forest tiene AUC 0.995 vs Decision Tree 0.922.
      ¿Qué explica esa diferencia si ambos alcanzan recall similar?

  - id: arboles_decision
    nombre: Arboles de decision
    orden: 14
    prerrequisitos: [overfitting_underfitting]
    por_que_importa: La pieza base de los tres modelos que siguen.
    material_local:
      - 09_RESULTADOS/resultados_temporal.json
      - 07_DATITO/casos_estudio/cancer_mama/preinforme_hito2_v02.pdf
    casos_estudio:
      - cancer_mama: "Decision Tree entrenado con criterio Gini, profundidad máxima optimizada por validación cruzada 5-fold. Resultados en test: accuracy 0.939, recall 0.881, con 5 falsos negativos. Matriz de confusión e interpretación de por qué tiende a sobreajustar frente a Random Forest."
    pregunta_diagnostico: >-
      Un arbol parte los datos con preguntas del tipo "Rooms <= 3?". Como decide
      cual pregunta hacer primero? En cáncer de mama, ¿por qué Decision Tree
      obtiene peor recall (0.881) y más falsos negativos (5) que Random Forest?

  - id: random_forest
    nombre: Random Forest
    orden: 15
    prerrequisitos: [arboles_decision]
    por_que_importa: >-
      Primer ensemble. Introduce la idea de que promediar modelos mediocres
      supera al mejor individual.
    material_local:
      - 09_RESULTADOS/resultados_temporal.json
      - 09_RESULTADOS/comparacion_estadistica.json
      - 07_DATITO/casos_estudio/cancer_mama/preinforme_hito2_v02.pdf
      - 07_DATITO/casos_estudio/cancer_mama/Presentacion_Hito2_v2_2.pdf
    casos_estudio:
      - cancer_mama: "Random Forest ganador del Hito 2: 100 árboles, profundidad máxima 5, criterio Gini. Resultados test: accuracy 0.974, recall 0.929, FPR 0.000, AUC 0.995. Comparación directa con SVM (0.965 acc, 0.905 recall) y Decision Tree (0.939 acc, 0.881 recall). Visualización de matrices de confusión de los tres modelos sobre el mismo test de 114 pacientes."
    pregunta_diagnostico: >-
      Si un arbol solo sobreajusta, por que 300 arboles sobreajustados
      promediados sobreajustan menos? En cáncer de mama, Random Forest (100 árboles)
      logra recall 0.929 vs Decision Tree 0.881. ¿Qué hace Random Forest que no hace
      un árbol individual? ¿Por qué el boostrap y los subconjuntos aleatorios ayudan?

  - id: gradient_boosting
    nombre: Gradient Boosting
    orden: 16
    prerrequisitos: [random_forest]
    por_que_importa: Es tu modelo final. HistGradientBoosting gano la comparacion.
    material_local:
      - 09_RESULTADOS/resultados_temporal.json
      - 06_ENTREGABLES/INFORME_MODELO_FCD_P3.md
    pregunta_diagnostico: >-
      Random Forest entrena sus arboles en paralelo e independientes. Gradient
      Boosting los entrena en secuencia. Que hace cada arbol nuevo del boosting
      que no hace ninguno del forest?

  - id: ensembles
    nombre: Ensembles
    orden: 17
    prerrequisitos: [gradient_boosting]
    por_que_importa: Generaliza el patron. Tu desafio incluye analisis de diversidad.
    material_local:
      - 08_PROYECTO_FCD/Desafio/src/08_ensemble.py
      - 08_PROYECTO_FCD/Desafio/src/06_hierarchical.py
    pregunta_diagnostico: >-
      Combinas dos modelos que aciertan 80% cada uno. En que caso el ensemble
      supera el 80%, y en que caso no gana nada?

  - id: redes_neuronales
    nombre: Redes neuronales
    orden: 18
    prerrequisitos: [gradient_boosting]
    por_que_importa: "Cambio de paradigma: el modelo aprende sus propias features."
    # 2026-09-21: las laminas de la Clase 8 ya estan en texto local. Sigue
    # sin haber codigo propio ejecutado por el alumno para este concepto.
    sin_material_local: false
    material_local:
      - 11_PRESENTACIÓN/_markdown/FCD-2026-2_08_DL_LLMs_Agents.md
      - 11_PRESENTACIÓN/_markdown/Resumen_Clase8_DL_LLMs_Agentes.md
    pregunta_diagnostico: >-
      En tus modelos de Melbourne tu elegiste las features. Que hace distinto
      una red neuronal con las features?

  - id: deep_learning
    nombre: Deep learning
    orden: 19
    prerrequisitos: [redes_neuronales]
    por_que_importa: Explica por que en datos tabulares sigue ganando el boosting y en vision o texto no.
    # 2026-09-21: las laminas de la Clase 8 ya estan en texto local. Sigue
    # sin haber codigo propio ejecutado por el alumno para este concepto.
    sin_material_local: false
    material_local:
      - 11_PRESENTACIÓN/_markdown/FCD-2026-2_08_DL_LLMs_Agents.md
      - 11_PRESENTACIÓN/_markdown/Resumen_Clase8_DL_LLMs_Agentes.md
    pregunta_diagnostico: >-
      Para tus datos tabulares de Melbourne, el boosting le gana a una red
      profunda. Por que, si el deep learning domina en imagenes y texto?

  - id: llm
    nombre: Modelos de lenguaje (LLM)
    orden: 20
    prerrequisitos: [deep_learning]
    por_que_importa: Base para entender que es y que no es un agente.
    # 2026-09-21: las laminas de la Clase 8 ya estan en texto local. Sigue
    # sin haber codigo propio ejecutado por el alumno para este concepto.
    sin_material_local: false
    material_local:
      - 11_PRESENTACIÓN/_markdown/FCD-2026-2_08_DL_LLMs_Agents.md
      - 11_PRESENTACIÓN/_markdown/Resumen_Clase8_DL_LLMs_Agentes.md
    pregunta_diagnostico: >-
      Un LLM predice el siguiente token. Como puede algo asi responder una
      pregunta que nunca vio escrita?

  - id: agentes_ia
    nombre: Agentes de IA
    orden: 21
    prerrequisitos: [llm]
    por_que_importa: Cierra el circulo. Este tutor es un agente y podras auditarlo por dentro.
    # 2026-09-21: las laminas de la Clase 8 ya estan en texto local. Sigue
    # sin haber codigo propio ejecutado por el alumno para este concepto.
    sin_material_local: false
    material_local:
      - 11_PRESENTACIÓN/_markdown/FCD-2026-2_08_DL_LLMs_Agents.md
      - 11_PRESENTACIÓN/_markdown/Resumen_Clase8_DL_LLMs_Agentes.md
      - .claude/skills/datito/SKILL.md
      - .mcp.json
