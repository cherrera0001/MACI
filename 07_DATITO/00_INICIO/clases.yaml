        - 'Qué clase es la positiva es una convención que se declara.'
        - 'La matriz solo describe el conjunto de test, no la realidad.'
        - 'Una tasa multiplicada por la población da un conteo.'
      no_confundir:
        - 'Filas = real ≠ filas = predicho: lee los rótulos (la lámina 19 pone lo predicho en las filas).'
        - 'Falso positivo ≠ falso negativo.'
        - 'Test ≠ realidad.'
      procedimiento:
