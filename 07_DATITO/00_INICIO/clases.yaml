  - n: 14
    unidad: 4
    titulo: 'ROC-AUC y elección del umbral'
    visual: roc_auc.html
    tipo: concepto
    conceptos: [roc_auc]
    objetivo: 'Elegir un punto de operación y comparar modelos por sus curvas ROC.'
    activacion: 'El modelo rojo tiene más TPR en un umbral y el naranjo en otro. ¿Cuál es mejor?'
    bloom:
      nivel: Evaluar
      evidencia: 'Construye una curva ROC con cuatro puntos y decide si hay dominancia o cruce.'
      actividad_final: 'La lámina 23, a mano.'
      criterio_dominio: 'Compara curvas y no puntos, y justifica el umbral por el costo de cada error.'
    cierre:
      aprendiste:
        - 'El modelo entrega un puntaje; el umbral lo decides tú.'
        - 'Cada umbral es un punto; el modelo es la curva completa.'
        - 'El AUC resume toda la curva, pero no fija el umbral.'
      no_confundir:
        - 'Punto de operación ≠ modelo (C2 P9).'
        - 'AUC alto ≠ exactitud alta.'
        - 'Subir el umbral baja TPR y FPR a la vez: no van en sentidos opuestos.'
      procedimiento:
        - 'Un modelo es una curva, no un punto.'
        - 'Compara umbral a umbral: ¿uno tiene mayor TPR y menor FPR en todos?'
        - 'Si domina en todos, es mejor sin ambigüedad.'
        - 'Si se cruzan, depende del punto de operación.'
      pregunta_final: 'Dos curvas ROC se cruzan. ¿Puedes decir cuál modelo es mejor sin más información?'
      respuesta_final: 'No: depende del punto de operación, es decir, del costo relativo de falsos positivos y negativos. Solo una curva que domina en todos los umbrales es mejor sin ambigüedad. [FUENTE · Repo: 07_DATITO/patron_evaluacion.md §7]'

