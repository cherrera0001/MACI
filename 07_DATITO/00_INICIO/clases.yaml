        - 'Árbol sin límite ≠ buen modelo: sobreajusta.'
      procedimiento:
        - 'Calcula la impureza de cada hijo.'
        - 'Pondera por el tamaño de cada hijo.'
        - 'Compara con el padre y elige el corte de mayor ganancia.'
      pregunta_final: '¿Cuál es el Gini de un nodo con 1 de 8 de una clase y 7 de 8 de la otra?'
      respuesta_final: '1/8 · 7/8 + 7/8 · 1/8 = 14/64 = 0,21875. [FUENTE · Repo: 05_CLASES/transcripciones/2026-08-07T22_14_16Z_Fundamentos_en_Ciencia_de_Datos.md · 1:14:34]'

