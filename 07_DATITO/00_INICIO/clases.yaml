# El curso: unidades y clases en orden de estudio (spec.md G14).
#
# FUENTE UNICA del orden. 03_SCRIPTS/construir_navegacion.py lee este archivo y
# genera la portada (visual/index.html), la barra de cada clase (Anterior ·
# Indice · Siguiente, ficha Bloom, activacion) y el cierre de cada clase.
# Ningun HTML repite el orden a mano.
#
# NO se escriben aqui: prerrequisitos y lo que habilita cada clase (se derivan
# de curriculum.yaml via grafo.yaml a partir de `conceptos`), ni el tiempo de
# lectura (se calcula del texto del visual).
#
# El orden sigue los prerrequisitos del curriculo y la secuencia real de las
# clases del profesor (regresion el 31-jul, clasificacion el 7-ago, DL/LLM/
# agentes el 21-ago), y sube de comprender hacia analizar, evaluar y crear.
#
# visual: archivo en 07_DATITO/visual/ (con #ancla si la clase es una seccion),
#         o null si la clase esta pendiente de construir.
# tipo:   concepto (debe tener >= 3 preguntas con respuesta oculta) · repaso
# Las respuestas del cierre llevan su etiqueta G4.

unidades:
  1: Del problema a los datos
  2: 'Aprender una cantidad: regresión'
  3: Medir si el modelo sirve
  4: Clasificar y evaluar
  5: Modelos más potentes
  6: Integrar y rendir

clases:

  - n: 1
    unidad: 1
    titulo: '¿Qué problema resuelve la ciencia de datos?'
    visual: fundamentos_ciencia_datos.html
    tipo: concepto
    conceptos: [fundamentos_ciencia_datos]
    objetivo: 'Explicar qué problema resuelve la ciencia de datos, ubicar una organización en la escala data-driven y decidir cuándo no hace falta un modelo.'
    activacion: 'Una minera guarda cada día millones de registros de sus camiones. ¿Eso la convierte en una organización data-driven? Responde antes de leer.'
    bloom:
      nivel: Comprender
      evidencia: 'Explica con sus palabras la definición (interdisciplinario, conocimiento, datos) y ubica tres organizaciones en la escala de cinco etapas.'
      actividad_final: 'Reconstruir la ruta de retroceso del ciclo que contó el profesor: de puesta en marcha a exploración.'
      criterio_dominio: 'Ubica bien los tres casos y justifica con el criterio de la escala (¿los datos guían decisiones?), no con «usan muchos datos».'
    cierre:
      aprendiste:
        - 'La ciencia de datos extrae conocimiento accionable desde datos, combinando varias disciplinas.'
        - 'Tener datos no es ser data-driven: la escala de cinco etapas mide si los datos guían las decisiones.'
        - 'El ciclo es iterativo: cuando algo falla se vuelve a una etapa anterior.'
        - 'Big Data es una relación con la infraestructura disponible, no un número de terabytes.'
      no_confundir:
        - 'Usar muchos datos ≠ decidir a partir de los datos (C1 P2).'
        - 'Dominios distintos ≠ fuentes de datos distintas (C1 P1).'
        - 'Causa de los retrocesos (limpieza) ≠ tiempo invertido (recolección, limpieza, exploración).'
      procedimiento:
        - '¿Cuál es el requerimiento o pregunta? Sin él no hay ciencia de datos.'
        - '¿Hay datos que la respondan? ¿Hace falta un modelo o basta un resumen?'
        - 'Ubica la organización en la escala: ¿los datos guían decisiones o solo tareas puntuales?'
        - 'Si algo falla en producción, identifica a qué etapa del ciclo volver.'
      pregunta_final: 'Verdadero o falso: una empresa que registra todo en bases de datos ya es data-driven. Justifica.'
      respuesta_final: 'Falso. Registrar datos es una etapa temprana de la escala; data-driven exige que las decisiones se tomen a partir de los datos. [FUENTE · Repo: 07_DATITO/visual/fundamentos_ciencia_datos.html §3]'

  - n: 2
    unidad: 1
    titulo: 'Datos, filas, columnas, features y target'
    visual: datos_features_target.html
    tipo: concepto
    conceptos: [datos_features_target]
    objetivo: 'Distinguir fila, columna, feature, target, identificador y fuga de información en una tabla real.'
    activacion: 'En Galaxy Zoo, las columnas p_el y p_cs predicen casi perfecto la clase de cada galaxia. ¿Por qué no se pueden usar para entrenar?'
    bloom:
      nivel: Analizar
      evidencia: 'Clasifica cada columna de una tabla nueva como feature, target, identificador o fuga, y justifica cada decisión.'
      actividad_final: 'Decidir si una columna produce fuga de información (Date en Melbourne; p_el en Galaxy Zoo).'
      criterio_dominio: 'Clasifica sin error una tabla de seis o más columnas y detecta la fuga con el argumento «no existirá al momento de predecir».'
    cierre:
      aprendiste:
        - 'Cada fila es una observación y cada columna una variable; qué es una fila se decide antes de modelar.'
        - 'El target es una decisión tuya, no una propiedad de la columna.'
        - 'Un identificador sirve para rastrear errores, no para predecir.'
        - 'Fuga de información: usar una columna que no existirá cuando haya que predecir.'
      no_confundir:
        - 'Más filas ≠ más columnas (C2 P3).'
        - 'Variable categórica sin orden ≠ numérica discretizada, que conserva el orden (C1 P6).'
        - 'Dato ≠ información: la información son datos en un contexto.'
      procedimiento:
        - 'Define qué es una fila.'
        - 'Marca el target: lo que quieres predecir.'
        - 'Para cada columna: ¿existirá al momento de predecir? Si no, es fuga.'
        - 'Separa los identificadores y clasifica el resto por tipo.'
      pregunta_final: 'Quieres predecir si un cliente comprará, y el dataset trae «monto_final_pagado». ¿Es una buena feature?'
      respuesta_final: 'No: ese monto se conoce después de la compra. Usarla es fuga de información: el modelo se vería excelente al validar y fallaría al predecir de verdad. [DATITO]'

  - n: 3
    unidad: 1
    titulo: 'EDA: conocer los datos antes de modelar'
    visual: eda.html
    tipo: concepto
    conceptos: [eda]
    objetivo: 'Leer la distribución de una variable y detectar faltantes, atípicos y dificultades del problema antes de modelar.'
    activacion: 'En la clase de EDA, el histograma de consumo de camiones tenía muchísimos ceros. ¿Son camiones inactivos o reportes que faltan? ¿Cómo lo decidirías?'
    bloom:
      nivel: Analizar
      evidencia: 'Interpreta un resumen (media, mediana, desviación, percentiles) y dice qué revela y qué no revela sobre la forma y la calidad.'
      actividad_final: 'Camino inverso: reconstruir la forma de una distribución a partir de cinco números, sin gráfico.'
      criterio_dominio: 'Distingue media de mediana ante asimetría y detecta un cero o centinela sospechoso con un argumento de calidad, no de estética.'
    cierre:
      aprendiste:
        - 'Un resumen no determina la forma: hay que mirar la distribución.'
        - 'La media se mueve con los extremos; la mediana no.'
        - 'La varianza de una muestra divide por n − 1.'
        - 'Correlación no es causalidad, y un gráfico puede engañar por su escala.'
      no_confundir:
        - 'Cantidad que describe una variable (varianza) ≠ cantidad que describe un clasificador (precisión, AUC) (C2 P4).'
        - 'Hipótesis ≠ medición (C2 P11).'
        - 'Necesario ≠ suficiente: toda falla trae vibración, no toda vibración es falla.'
      procedimiento:
        - 'Tipo de variable → gráfico adecuado.'
        - 'Centro (media y mediana) y extensión (desviación, percentiles).'
        - 'Busca ceros, centinelas y atípicos: ¿error o dato real?'
        - 'Escribe hipótesis, no conclusiones.'
      pregunta_final: 'Si la media es mucho mayor que la mediana, ¿qué te dice eso de la distribución?'
      respuesta_final: 'Que tiene cola a la derecha: unos pocos valores altos arrastran la media, y la mediana representa mejor el caso típico. [DATITO]'

  - n: 4
    unidad: 1
    titulo: 'Calidad, limpieza y preparación de datos'
    visual: limpieza_preparacion.html
    tipo: concepto
    conceptos: [limpieza_preparacion]
    objetivo: 'Decidir qué es un error de datos que se limpia y qué es una decisión de modelado que se documenta.'
    activacion: 'En la tabla de consumo minero aparece −999 y un 2900 entre valores cercanos a 200. ¿Los borras? Responde antes de leer.'
    bloom:
      nivel: Evaluar
      evidencia: 'Resuelve una tabla tipo 9B: identifica cada problema, lo clasifica y justifica su tratamiento.'
      actividad_final: 'Resolver la 9B del Certamen 1 (consumo de camiones).'
      criterio_dominio: 'Identifica centinela, atípico, sobrecarga semántica y formato; distingue atípico de error; justifica cada decisión con su efecto en la media.'
    cierre:
      aprendiste:
        - 'Un centinela (−999) no es un número: sesga cualquier promedio.'
        - 'Un atípico puede ser real o un error de digitación: se verifica, no se borra por defecto.'
        - 'Excluir una columna útil o imputar son decisiones de modelado, no limpieza.'
        - 'Una tabla bien formada: una fila por observación, identificadores que enlazan otras tablas, fechas completas.'
      no_confundir:
        - 'Limpiar (corregir lo mal registrado) ≠ decidir (excluir, imputar, elegir target).'
        - 'Atípico ≠ error.'
        - 'Faltante ≠ cero.'
      procedimiento:
        - 'Define la fila y las variables.'
        - 'Busca centinelas, faltantes, tipos mezclados y atípicos.'
        - 'Para cada uno: ¿está mal registrado (limpiar) o es una decisión (documentar)?'
        - 'Calcula el efecto en la media antes y después.'
      pregunta_final: '¿Por qué no basta con borrar en la 9B los valores a más de dos desviaciones de la media?'
      respuesta_final: 'Porque los −999 inflan la desviación y pueden quedar dentro del corte, y porque un atípico puede ser real. Primero se tratan los centinelas como faltantes; después se evalúa cada atípico. [FUENTE · Repo: 07_DATITO/visual/limpieza_preparacion.html §6]'

  - n: 5
    unidad: 2
    titulo: 'Regresión: predecir una cantidad'
    visual: clase6_regresion.html
    tipo: concepto
    conceptos: [regresion]
    objetivo: 'Explicar el modelo lineal ŷ = θ₀ + θ₁x: qué es dato, qué aprende el modelo y qué significa cada símbolo.'
    activacion: 'El profesor quiere saber cuánto pesa un árbol sin cortarlo. ¿Qué medirías, y cómo lo usarías para predecir?'
    bloom:
      nivel: Comprender
      evidencia: 'Explica θ₀ y θ₁ con sus unidades y predice un valor dentro del rango de los datos.'
      actividad_final: '«Tu pregunta»: el árbol de 45 cm y el compañero que confunde θ₁ con el peso a radio cero.'
      criterio_dominio: 'Nombra qué símbolo responde cada pregunta y declara cuándo una predicción es extrapolación.'
    cierre:
      aprendiste:
        - 'Regresión: predecir un valor real, una cantidad.'
        - 'θ₁ es cuánto cambia ŷ por unidad de x; θ₀ es ŷ cuando x = 0.'
        - 'La regresión se llama lineal por ser lineal en los θ, no en x.'
        - 'La complejidad del modelo es su número de parámetros.'
      no_confundir:
        - 'Pendiente (θ₁) ≠ intercepto (θ₀).'
        - 'Lineal en θ ≠ lineal en x: la polinomial sigue siendo regresión lineal.'
        - 'Predecir dentro del rango ≠ extrapolar.'
      procedimiento:
        - 'Identifica x (dato), y (target) y los θ (lo que aprende el modelo).'
        - 'Interpreta θ₁ en unidades de y por unidad de x.'
        - 'Antes de predecir, revisa el rango de x observado.'
      pregunta_final: '¿Es ŷ = θ₀ + θ₁x + θ₂x² una regresión lineal?'
      respuesta_final: 'Sí: es lineal en los parámetros, porque cada θ aparece una vez multiplicando un término; x² es solo una columna nueva. [FUENTE · Repo: 05_CLASES/transcripciones/06Clase_Fundamentos_en_Ciencia_de_Datos_31_de_julio.md · 0:37:49]'

  - n: 6
    unidad: 2
    titulo: 'Función de costo, error y R²'
    visual: regresion_y_costo.html
    tipo: concepto
    conceptos: [regresion]
    objetivo: 'Calcular el error de una recta, explicar por qué se eleva al cuadrado y leer el R² contra la media.'
    activacion: 'Dos rectas pasan cerca de los mismos puntos. ¿Cómo decides cuál es mejor sin mirarlas?'
    bloom:
      nivel: Aplicar
      evidencia: 'Calcula MSE o MAE a mano con pocos puntos e interpreta el R² como comparación con predecir la media.'
      actividad_final: 'Encontrar con los controles la recta de menor costo y explicar por qué ese es el mínimo.'
      criterio_dominio: 'Calcula sin error un costo con tres o cuatro puntos e interpreta un R² igual a 0 y uno negativo.'
    cierre:
      aprendiste:
        - 'La función de costo resume en un número qué tan lejos está la recta de los datos.'
        - 'Elevar al cuadrado elimina el signo y castiga más los errores grandes.'
        - 'Entrenar es elegir los θ que minimizan el costo.'
        - 'R² compara con predecir siempre la media: 0 es igual que la media; negativo, peor.'
      no_confundir:
        - 'MAE (en unidades de y) ≠ MSE (en unidades al cuadrado).'
        - 'R² alto en entrenamiento ≠ buen modelo fuera de la muestra.'
        - '«R² está entre 0 y 1» es falso: puede ser negativo.'
      procedimiento:
        - 'Calcula cada residuo y − ŷ.'
        - 'Eleva al cuadrado (MSE) o toma el valor absoluto (MAE) y promedia.'
        - 'R² = 1 − SSres/SStot: compara con la media.'
      pregunta_final: 'Un modelo tiene R² = −0,08 en test. ¿Qué significa?'
      respuesta_final: 'Que predice peor que usar siempre la media de y: su suma de errores al cuadrado supera la de la media. [DATITO]'

  - n: 7
    unidad: 3
    titulo: 'Train, validation y test'
    visual: train_validation_test.html
    tipo: concepto
    conceptos: [train_validation_test]
    objetivo: 'Separar entrenamiento, validación y test, y decir qué decisión se toma con cada uno.'
    activacion: 'Si eliges el mejor modelo mirando el test, ¿ese número de test sigue siendo una medida honesta?'
    bloom:
      nivel: Aplicar
      evidencia: 'Asigna cada decisión (ajustar θ, elegir hiperparámetro, reportar) al conjunto correcto.'
      actividad_final: 'Rotular un gráfico de resultados: con qué se entrenó y sobre qué se evaluó cada barra.'
      criterio_dominio: 'No usa el test para decidir y distingue parámetro de hiperparámetro en un caso nuevo.'
    cierre:
      aprendiste:
        - 'El test se guarda «en el bolsillo»: no se usa para decidir.'
        - 'La validación sirve para elegir hiperparámetros, como el grado del polinomio.'
        - 'Si decides con un conjunto, su número queda optimista.'
        - 'Un test debe representar los datos donde se usará el modelo.'
      no_confundir:
        - 'Parámetro (lo aprende el algoritmo) ≠ hiperparámetro (lo fijas tú antes).'
        - 'Entrenado con ≠ evaluado sobre.'
        - 'Elegir (validación) ≠ medir (test).'
      procedimiento:
        - 'Aparta el test primero.'
        - 'Ajusta con train; elige con validación.'
        - 'Mide una sola vez en test y reporta.'
      pregunta_final: '¿Por qué hacen falta validación y test, si ambos son datos que el modelo no vio?'
      respuesta_final: 'Porque al elegir con la validación, esa medida se vuelve optimista; el test, que no se usó para decidir, da la medida honesta. [FUENTE · Repo: 05_CLASES/transcripciones/06Clase_Fundamentos_en_Ciencia_de_Datos_31_de_julio.md · 0:49:50]'

  - n: 8
    unidad: 3
    titulo: 'Validación cruzada y selección de modelos'
    visual: validacion_cruzada.html
    tipo: concepto
    conceptos: [validacion_cruzada]
    objetivo: 'Elegir una estrategia de validación y justificar por qué una sola partición puede engañar.'
    activacion: 'Con una partición gana el polinomio de grado 7; con otra, el de grado 4. ¿Cuál eliges?'
    bloom:
      nivel: Evaluar
      evidencia: 'Explica K-Fold, bootstrap y submuestreo, y elige uno según la cantidad de datos y su orden.'
      actividad_final: 'Interpretar la distribución del error de validación y decir si el error de test cae dentro de ella.'
      criterio_dominio: 'Justifica la estrategia y compara todos los modelos con la misma partición.'
    cierre:
      aprendiste:
        - 'Re-particionar varias veces evita depender de una partición con suerte.'
        - 'En K-Fold cada dato valida exactamente una vez.'
        - 'El bootstrap muestrea con reemplazo; con muestras de tamaño n contiene cerca del 63,2 % de los datos distintos.'
        - 'Los modelos se comparan con la misma partición.'
      no_confundir:
        - 'Una sola partición («validación nomás») ≠ validación cruzada.'
        - 'Error promedio ≠ distribución del error.'
        - 'Con orden temporal no se desordena al azar.'
      procedimiento:
        - '¿Cuántos datos hay? ¿Tienen orden temporal?'
        - 'Elige la estrategia y fija la partición.'
        - 'Compara por el promedio y por la dispersión del error.'
        - 'El test sigue aparte.'
      pregunta_final: 'En sklearn un modelo obtiene −0,8 y otro −1,2 (MSE negativo). ¿Cuál es mejor?'
      respuesta_final: 'El de −0,8: más cercano a cero significa menor error. Lo explicó la ayudantía, que no entra al certamen. [FUENTE · Repo: 05_CLASES/transcripciones/2026-08-07T23_57_03Z_Fundamentos_en_Ciencia_de_Datos.md · 0:29:51]'

  - n: 9
    unidad: 3
    titulo: 'Generalización, extrapolación y datos no vistos'
    visual: generalizacion.html
    tipo: concepto
    conceptos: [generalizacion]
    objetivo: 'Decidir si una predicción es confiable según los datos que el modelo vio, y explicar una caída de rendimiento.'
    activacion: 'Tu recta tiene R² = 0,93 con árboles de 8 a 22 cm de radio. Te piden el peso de uno de 45 cm. ¿Lo entregas?'
    bloom:
      nivel: Evaluar
      evidencia: 'Distingue interpolar de extrapolar y descompone una caída de validación a test en sus mecanismos.'
      actividad_final: 'Las dudas resueltas del árbol de 45 cm y del agrónomo, al final de esta clase.'
      criterio_dominio: 'Declara la extrapolación y explica la caída con dos mecanismos: haber decidido con esos datos y el cambio de distribución.'
    cierre:
      aprendiste:
        - 'Generalizar es funcionar con datos que el modelo no ha visto.'
        - 'Fuera del rango observado se extrapola: el número existe, la evidencia no.'
        - 'Una caída de validación a test puede venir de haber decidido con esos datos o de que los datos cambiaron.'
      no_confundir:
        - 'Interpolar ≠ extrapolar.'
        - 'R² alto dentro del rango ≠ predicción confiable fuera de él.'
        - 'Cambio de distribución ≠ sobreajuste, aunque se combinen.'
      procedimiento:
        - 'Compara el caso a predecir con el rango de los datos.'
        - 'Si está fuera: declara la extrapolación o consigue datos.'
        - 'Ante una caída: ¿decidiste con esos datos? ¿cambió la población?'
      pregunta_final: 'El 29,1 % del test de 2017 son suburbios que no existen en los datos de 2016. ¿Qué tipo de problema de generalización es?'
      respuesta_final: 'Un cambio de distribución: el modelo predice casos con un valor (el suburbio) que nunca vio, y solo puede apoyarse en variables que sí vio, como ubicación y tipo. [FUENTE · Repo: 09_RESULTADOS/resultados_temporal.json]'

  - n: 10
    unidad: 3
    titulo: 'Overfitting y underfitting'
    visual: overfitting_underfitting.html
    tipo: concepto
    conceptos: [overfitting_underfitting]
    objetivo: 'Diagnosticar sobreajuste y subajuste calculando la brecha, y proponer remedios del curso.'
    activacion: 'El modelo B tiene R² 0,98 en entrenamiento y 0,54 en prueba. ¿Es el mejor de la tabla?'
    bloom:
      nivel: Analizar
      evidencia: 'Clasifica tres modelos con la brecha, nombra el mecanismo y propone un remedio coherente.'
      actividad_final: 'La tabla A/B/C en el formato del profesor, y la versión con MAE.'
      criterio_dominio: 'Calcula la brecha antes de etiquetar y lee bien una métrica de error, donde menos es mejor.'
    cierre:
      aprendiste:
        - 'Brecha grande entre entrenamiento y prueba: sobreajuste. Malo en ambos: subajuste.'
        - 'La complejidad (número de parámetros) mueve el balance entre ambos.'
        - 'Un error de entrenamiento igual a cero no prueba calidad.'
        - 'También se puede sobreajustar la validación: por eso existe el test.'
      no_confundir:
        - 'Sobreajuste ≠ subajuste ≠ error alto (C2 P2).'
        - 'Más filas (reduce el sobreajuste) ≠ más columnas (lo aumenta) (C2 P3).'
        - 'Error de entrenamiento ≠ calidad del modelo (C2 P7).'
      procedimiento:
        - 'Localiza el par de números: dentro y fuera del entrenamiento.'
        - 'Calcula la brecha.'
        - 'Clasifica: brecha grande → sobreajuste; malo en ambos → subajuste.'
        - 'Nombra el mecanismo, no solo la etiqueta.'
        - 'Remedio según la causa: simplificar, más filas, elegir con validación cruzada.'
      pregunta_final: 'Con MAE (menos es mejor): P 0,15 / 0,92 y Q 0,71 / 0,78. ¿Cuál sobreajusta?'
      respuesta_final: 'P: error muy bajo en entrenamiento y alto en prueba, con brecha 0,77. [FUENTE · Repo: 07_DATITO/dudas.yaml · 2026-09-19-mae-pqr]'

  - n: 11
    unidad: 4
    titulo: 'Clasificación: cuando la etiqueta no es un número'
    visual: clasificacion.html
    tipo: concepto
    conceptos: [clasificacion]
    objetivo: 'Distinguir un problema de clasificación de uno de regresión, y explicar qué cambia en el error.'
    activacion: '«Frío, templado, caliente»: ¿es un problema de clasificación o de regresión?'
    bloom:
      nivel: Analizar
      evidencia: 'Decide el tipo de problema por el target y justifica por qué el MAE no aplica a clases.'
      actividad_final: 'Clasificar cinco targets como regresión o clasificación, con su justificación.'
      criterio_dominio: 'Decide por el target y no por las features, y reconoce una categoría con una variable numérica de fondo.'
    cierre:
      aprendiste:
        - 'Clasificar es predecir una categoría.'
        - 'Una variable categórica no tiene orden entre sus valores.'
        - 'El modelo puede entregar una probabilidad, no solo una clase.'
        - 'Un modelo 100 % perfecto es sospechoso.'
      no_confundir:
        - 'Categórica ≠ cualitativa.'
        - 'Categoría ≠ discretización de un número.'
        - 'Lo que define la tarea es el target, no las features.'
      procedimiento:
        - 'Mira el target: ¿número o categoría?'
        - '¿Tiene orden? ¿Hay una variable numérica de fondo?'
        - 'Elige la tarea según para qué usarás la predicción.'
      pregunta_final: 'Predecir la nota de 1 a 7 de un alumno: ¿regresión o clasificación?'
      respuesta_final: 'Regresión si interesa el valor, porque es un número con distancia; clasificación si solo interesa aprobado o reprobado. Lo decide el uso de la predicción. [INFERENCIA] Así lo planteó el profesor a un grupo: [FUENTE · Repo: 05_CLASES/transcripciones/2026-08-14T22_09_23Z_Fundamentos_en_Ciencia_de_Datos.md · 1:57:26]'

  - n: 12
    unidad: 4
    titulo: 'Matriz de confusión'
    visual: matriz_confusion.html
    tipo: concepto
    conceptos: [matriz_confusion]
