    cierre:
      aprendiste:
        - 'El árbol divide los datos buscando grupos más puros.'
        - 'El Gini de un nodo es su error esperado; se pondera por el tamaño de cada hijo.'
        - 'El árbol se detiene por pureza, o antes, para no sobreajustar.'
        - 'La medida de impureza es un hiperparámetro: se elige con validación cruzada.'
      no_confundir:
