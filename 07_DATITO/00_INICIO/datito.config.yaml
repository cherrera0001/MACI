# Configuración de Datito
#
# Todo lo específico del alumno y su asignatura vive aquí, separado de las
# skills. Para reutilizar Datito en otro curso se edita este archivo y se
# reconstruye curriculum.yaml; las skills no se tocan.
#
# Lo que NO va aquí: credenciales. Viven en .env (GitHub) y en ~/.notebooklm
# (Gemini Notebook), y ninguno de los dos se versiona.

# MULTI-CURSO (ADR-001)
# Si no están presentes, los scripts asumen:
#   course_id: fcd-2026-2
#   learner_id: cristobal_herrera
# Esto preserva backward compatibility con sesiones antiguas.

course_id: fcd-2026-2
learner_id: cristobal_herrera

alumno:
  nombre: Cristobal Herrera
  email: herrera.jara.cristobal@gmail.com

asignatura:
  nombre: Fundamentos de Ciencia de Datos
  periodo: T2-2026
  institucion: Universidad de Concepcion
  docente_practicos: Alejandra Fernandez

# Como evalua el profesor. Lo detecta patron_evaluacion.md a partir de las
# evaluaciones reales; esto es el resumen que condiciona el entrenamiento.
evaluacion:
  formato: prueba escrita, sin Internet, sin codigo
  calculo: manual, papel y lapiz
  formatos_de_pregunta:
    - verdadero/falso con justificacion
    - seleccion multiple con varias correctas
    - diagnostico desde una figura o tabla
    - desarrollo con tabla de datos
  firma_del_profesor: >-
    Cada pregunta se resuelve separando dos conceptos vecinos. No evalua
    definiciones: evalua discriminacion. Ver patron_evaluacion.md.

# Proyectos propios usados como casos de estudio. Son lo que hace concreto el
# entrenamiento: ejemplos que el alumno puede verificar.
proyectos:
  - id: melbourne
    nombre: Prediccion de precios de propiedades en Melbourne
    tipo: regresion
    datos: 04_DATOS/housing_dashai_2016_2017.csv
    resultados: 05_RESULTADOS/resultados_temporal.json
    ensena: [regresion, train_validation_test, validacion_cruzada, generalizacion, overfitting_underfitting, arboles_decision, random_forest, gradient_boosting]
  - id: galaxy_zoo
    nombre: Clasificacion de galaxias Galaxy Zoo
    tipo: clasificacion
    datos: 02_PROYECTO_FCD/Desafio/
    resultados: 02_PROYECTO_FCD/Desafio/REPORT.md
    ensena: [clasificacion, matriz_confusion, metricas_clasificacion, roc_auc, ensembles]

# Biblioteca externa. Opcional: si no esta disponible, Datito degrada y sigue
# con el material local, etiquetando lo que no tiene respaldo.
notebooklm:
  habilitado: true
  notebook_id: 97ce114e-2371-44eb-85b5-527cd28180cb
  nombre: Fundamentals of Data Science Syllabus
  servidor_mcp: notebooklm

# Reglas pedagogicas. Son las unicas que conviene ajustar por alumno;
# el resto del metodo vive en spec.md.
pedagogia:
  idioma: es
  tratamiento: tu

  # REGLA DE CONCRECION. Cristobal digiere mal la abstraccion matematica pura:
  # "se me hace muy dificil digerir todo esto cuando se expresa de forma
  # abstracta, usando funciones matematicas" (2026-09-20).
  #
  # Orden obligatorio al introducir cualquier formula:
  #   1. situacion real y cotidiana, de un dominio concreto
  #   2. que pregunta responde la formula, en palabras
  #   3. numeros pequenos, calculables a mano
  #   4. recien entonces la notacion
  #
  # Nunca abrir con la formula. Nunca usar theta, sigma o sumatorias antes de
  # que el fenomeno este claro con numeros.
  concrecion_obligatoria: true

  # Dominios para los ejemplos. ROTAR: usar siempre Melbourne enseña Melbourne,
  # no el concepto. La transferencia exige cambiar de dominio.
  dominios:
    - mineria: consumo de combustible por carga, fallas de maquinaria, ley de mineral
    - salud: deteccion de cancer, diagnostico de enfermedades, tiempos de espera
    - forestal: crecimiento de arboles, riesgo de incendio, volumen de madera
    - transporte: cantidad de pasajeros, tiempos de viaje, demanda por hora
    - meteorologia: lluvia, nivel de rios, inundaciones, temperatura
    - industria: control de calidad, deteccion de defectos, mantenimiento predictivo
    - agricultura: rendimiento por hectarea, riego, plagas

  # El terminal es mal medio para matematicas. Cuando un concepto dependa de
  # ver una relacion -rectas, residuos, curvas, superficies de costo, ROC-,
  # generar un artefacto HTML en 07_DATITO/visual/ que abra en el navegador,
  # autocontenido y sin conexion. No dibujar con ASCII lo que se entiende
  # mirando.
  preferir_visual: true
  nivel: >-
    Adulto que ya ejecuto un proyecto completo de ML con validacion temporal,
    bootstrap pareado y auditoria de reproducibilidad. No tratarlo como
    principiante ni celebrar cada acierto.
  intentos_antes_de_dar_la_solucion: 2
  exige_calculo_manual: true
  evidencia_para_dominado: [explicar, aplicar, interpretar, transferir]

# --------------------------------------------------------------------------
# PARA REUTILIZAR ESTE TUTOR EN OTRO CURSO
#
# 1. Editar este archivo: alumno, asignatura, proyectos, notebook.
# 2. Reescribir 07_DATITO/curriculum.yaml con los conceptos del nuevo
#    programa, sus prerrequisitos y el material que los cubre.
# 3. Vaciar progreso.yaml -todos los conceptos en NO_ESTUDIADO-,
#    errores_conceptuales.yaml (observados: []) y bitacora/.
# 4. Si hay evaluaciones anteriores, reconstruir patron_evaluacion.md desde
#    ellas. Es lo que mas cambia entre profesores y lo que mas rinde.
# 5. Ejecutar: python 03_CODIGO/datito_estado.py
#
# Las skills de .claude/skills/ no se modifican: leen de estos archivos.
# --------------------------------------------------------------------------
