clases:
- activacion: Una minera guarda cada día millones de registros de sus camiones. ¿Eso
    la convierte en una organización data-driven? Responde antes de leer.
  bloom:
    actividad_final: 'Reconstruir la ruta de retroceso del ciclo que contó el profesor:
      de puesta en marcha a exploración.'
    criterio_dominio: Ubica bien los tres casos y justifica con el criterio de la
      escala (¿los datos guían decisiones?), no con «usan muchos datos».
    evidencia: Explica con sus palabras la definición (interdisciplinario, conocimiento,
      datos) y ubica tres organizaciones en la escala de cinco etapas.
    nivel: Comprender
  cierre:
    aprendiste:
    - La ciencia de datos extrae conocimiento accionable desde datos, combinando varias
      disciplinas.
    - 'Tener datos no es ser data-driven: la escala de cinco etapas mide si los datos
      guían las decisiones.'
    - 'El ciclo es iterativo: cuando algo falla se vuelve a una etapa anterior.'
    - Big Data es una relación con la infraestructura disponible, no un número de
      terabytes.
    no_confundir:
    - Usar muchos datos ≠ decidir a partir de los datos (C1 P2).
    - Dominios distintos ≠ fuentes de datos distintas (C1 P1).
    - Causa de los retrocesos (limpieza) ≠ tiempo invertido (recolección, limpieza,
      exploración).
    pregunta_final: 'Verdadero o falso: una empresa que registra todo en bases de
      datos ya es data-driven. Justifica.'
    procedimiento:
    - ¿Cuál es el requerimiento o pregunta? Sin él no hay ciencia de datos.
    - ¿Hay datos que la respondan? ¿Hace falta un modelo o basta un resumen?
    - 'Ubica la organización en la escala: ¿los datos guían decisiones o solo tareas
      puntuales?'
    - Si algo falla en producción, identifica a qué etapa del ciclo volver.
    respuesta_final: 'Falso. Registrar datos es una etapa temprana de la escala; data-driven
      exige que las decisiones se tomen a partir de los datos. [FUENTE · Repo: 07_DATITO/visual/fundamentos_ciencia_datos.html
      §3]'
  conceptos:
  - fundamentos_ciencia_datos
  n: 1
  objetivo: Explicar qué problema resuelve la ciencia de datos, ubicar una organización
    en la escala data-driven y decidir cuándo no hace falta un modelo.
  tipo: concepto
  titulo: ¿Qué problema resuelve la ciencia de datos?
  unidad: 1
  visual: eda.html
- activacion: En Galaxy Zoo, las columnas p_el y p_cs predicen casi perfecto la clase
    de cada galaxia. ¿Por qué no se pueden usar para entrenar?
  bloom:
    actividad_final: Decidir si una columna produce fuga de información (Date en Melbourne;
      p_el en Galaxy Zoo).
    criterio_dominio: Clasifica sin error una tabla de seis o más columnas y detecta
      la fuga con el argumento «no existirá al momento de predecir».
    evidencia: Clasifica cada columna de una tabla nueva como feature, target, identificador
      o fuga, y justifica cada decisión.
    nivel: Analizar
  cierre:
    aprendiste:
    - Cada fila es una observación y cada columna una variable; qué es una fila se
      decide antes de modelar.
    - El target es una decisión tuya, no una propiedad de la columna.
    - Un identificador sirve para rastrear errores, no para predecir.
    - 'Fuga de información: usar una columna que no existirá cuando haya que predecir.'
    no_confundir:
    - Más filas ≠ más columnas (C2 P3).
    - Variable categórica sin orden ≠ numérica discretizada, que conserva el orden
      (C1 P6).
    - 'Dato ≠ información: la información son datos en un contexto.'
    pregunta_final: Quieres predecir si un cliente comprará, y el dataset trae «monto_final_pagado».
      ¿Es una buena feature?
    procedimiento:
    - Define qué es una fila.
    - 'Marca el target: lo que quieres predecir.'
    - 'Para cada columna: ¿existirá al momento de predecir? Si no, es fuga.'
    - Separa los identificadores y clasifica el resto por tipo.
    respuesta_final: 'No: ese monto se conoce después de la compra. Usarla es fuga
      de información: el modelo se vería excelente al validar y fallaría al predecir
      de verdad. [DATITO]'
  conceptos:
  - datos_features_target
  n: 2
  objetivo: Distinguir fila, columna, feature, target, identificador y fuga de información
    en una tabla real.
  tipo: concepto
  titulo: Datos, filas, columnas, features y target
  unidad: 1
  visual: datos_features_target.html
- activacion: En la clase de EDA, el histograma de consumo de camiones tenía muchísimos
    ceros. ¿Son camiones inactivos o reportes que faltan? ¿Cómo lo decidirías?
  bloom:
    actividad_final: 'Camino inverso: reconstruir la forma de una distribución a partir
      de cinco números, sin gráfico.'
    criterio_dominio: Distingue media de mediana ante asimetría y detecta un cero
      o centinela sospechoso con un argumento de calidad, no de estética.
    evidencia: Interpreta un resumen (media, mediana, desviación, percentiles) y dice
      qué revela y qué no revela sobre la forma y la calidad.
    nivel: Analizar
  cierre:
    aprendiste:
    - 'Un resumen no determina la forma: hay que mirar la distribución.'
    - La media se mueve con los extremos; la mediana no.
    - La varianza de una muestra divide por n − 1.
    - Correlación no es causalidad, y un gráfico puede engañar por su escala.
    no_confundir:
    - Cantidad que describe una variable (varianza) ≠ cantidad que describe un clasificador
      (precisión, AUC) (C2 P4).
    - Hipótesis ≠ medición (C2 P11).
    - 'Necesario ≠ suficiente: toda falla trae vibración, no toda vibración es falla.'
    pregunta_final: Si la media es mucho mayor que la mediana, ¿qué te dice eso de
      la distribución?
    procedimiento:
    - Tipo de variable → gráfico adecuado.
    - Centro (media y mediana) y extensión (desviación, percentiles).
    - 'Busca ceros, centinelas y atípicos: ¿error o dato real?'
    - Escribe hipótesis, no conclusiones.
    respuesta_final: 'Que tiene cola a la derecha: unos pocos valores altos arrastran
      la media, y la mediana representa mejor el caso típico. [DATITO]'
  conceptos:
  - eda
  n: 3
  objetivo: Leer la distribución de una variable y detectar faltantes, atípicos y
    dificultades del problema antes de modelar.
  tipo: concepto
  titulo: 'EDA: conocer los datos antes de modelar'
  unidad: 1
  visual: eda.html
- activacion: En la tabla de consumo minero aparece −999 y un 2900 entre valores cercanos
    a 200. ¿Los borras? Responde antes de leer.
  bloom:
    actividad_final: Resolver la 9B del Certamen 1 (consumo de camiones).
    criterio_dominio: Identifica centinela, atípico, sobrecarga semántica y formato;
      distingue atípico de error; justifica cada decisión con su efecto en la media.
    evidencia: 'Resuelve una tabla tipo 9B: identifica cada problema, lo clasifica
      y justifica su tratamiento.'
    nivel: Evaluar
  cierre:
    aprendiste:
    - 'Un centinela (−999) no es un número: sesga cualquier promedio.'
    - 'Un atípico puede ser real o un error de digitación: se verifica, no se borra
      por defecto.'
    - Excluir una columna útil o imputar son decisiones de modelado, no limpieza.
    - 'Una tabla bien formada: una fila por observación, identificadores que enlazan
      otras tablas, fechas completas.'
    no_confundir:
    - Limpiar (corregir lo mal registrado) ≠ decidir (excluir, imputar, elegir target).
    - Atípico ≠ error.
    - Faltante ≠ cero.
    pregunta_final: ¿Por qué no basta con borrar en la 9B los valores a más de dos
      desviaciones de la media?
    procedimiento:
    - Define la fila y las variables.
    - Busca centinelas, faltantes, tipos mezclados y atípicos.
    - 'Para cada uno: ¿está mal registrado (limpiar) o es una decisión (documentar)?'
    - Calcula el efecto en la media antes y después.
    respuesta_final: 'Porque los −999 inflan la desviación y pueden quedar dentro
      del corte, y porque un atípico puede ser real. Primero se tratan los centinelas
      como faltantes; después se evalúa cada atípico. [FUENTE · Repo: 07_DATITO/visual/limpieza_preparacion.html
      §6]'
  conceptos:
  - limpieza_preparacion
  n: 4
  objetivo: Decidir qué es un error de datos que se limpia y qué es una decisión de
    modelado que se documenta.
  tipo: concepto
  titulo: Calidad, limpieza y preparación de datos
  unidad: 1
  visual: limpieza_preparacion.html
- activacion: El profesor quiere saber cuánto pesa un árbol sin cortarlo. ¿Qué medirías,
    y cómo lo usarías para predecir?
  bloom:
    actividad_final: '«Tu pregunta»: el árbol de 45 cm y el compañero que confunde
      θ₁ con el peso a radio cero.'
    criterio_dominio: Nombra qué símbolo responde cada pregunta y declara cuándo una
      predicción es extrapolación.
    evidencia: Explica θ₀ y θ₁ con sus unidades y predice un valor dentro del rango
      de los datos.
    nivel: Comprender
  cierre:
    aprendiste:
    - 'Regresión: predecir un valor real, una cantidad.'
    - θ₁ es cuánto cambia ŷ por unidad de x; θ₀ es ŷ cuando x = 0.
    - La regresión se llama lineal por ser lineal en los θ, no en x.
    - La complejidad del modelo es su número de parámetros.
    no_confundir:
    - Pendiente (θ₁) ≠ intercepto (θ₀).
    - 'Lineal en θ ≠ lineal en x: la polinomial sigue siendo regresión lineal.'
    - Predecir dentro del rango ≠ extrapolar.
    pregunta_final: ¿Es ŷ = θ₀ + θ₁x + θ₂x² una regresión lineal?
    procedimiento:
    - Identifica x (dato), y (target) y los θ (lo que aprende el modelo).
    - Interpreta θ₁ en unidades de y por unidad de x.
    - Antes de predecir, revisa el rango de x observado.
    respuesta_final: 'Sí: es lineal en los parámetros, porque cada θ aparece una vez
      multiplicando un término; x² es solo una columna nueva. [FUENTE · Repo: 05_CLASES/transcripciones/06Clase_Fundamentos_en_Ciencia_de_Datos_31_de_julio.md
      · 0:37:49]'
  conceptos:
  - regresion
  n: 5
  objetivo: 'Explicar el modelo lineal ŷ = θ₀ + θ₁x: qué es dato, qué aprende el modelo
    y qué significa cada símbolo.'
  tipo: concepto
  titulo: 'Regresión: predecir una cantidad'
  unidad: 2
  visual: regresion.html
- activacion: Dos rectas pasan cerca de los mismos puntos. ¿Cómo decides cuál es mejor
    sin mirarlas?
  bloom:
    actividad_final: Encontrar con los controles la recta de menor costo y explicar
      por qué ese es el mínimo.
    criterio_dominio: Calcula sin error un costo con tres o cuatro puntos e interpreta
      un R² igual a 0 y uno negativo.
    evidencia: Calcula MSE o MAE a mano con pocos puntos e interpreta el R² como comparación
      con predecir la media.
    nivel: Aplicar
  cierre:
    aprendiste:
    - La función de costo resume en un número qué tan lejos está la recta de los datos.
    - Elevar al cuadrado elimina el signo y castiga más los errores grandes.
    - Entrenar es elegir los θ que minimizan el costo.
    - 'R² compara con predecir siempre la media: 0 es igual que la media; negativo,
      peor.'
    no_confundir:
    - MAE (en unidades de y) ≠ MSE (en unidades al cuadrado).
    - R² alto en entrenamiento ≠ buen modelo fuera de la muestra.
    - '«R² está entre 0 y 1» es falso: puede ser negativo.'
    pregunta_final: Un modelo tiene R² = −0,08 en test. ¿Qué significa?
    procedimiento:
    - Calcula cada residuo y − ŷ.
    - Eleva al cuadrado (MSE) o toma el valor absoluto (MAE) y promedia.
    - 'R² = 1 − SSres/SStot: compara con la media.'
    respuesta_final: 'Que predice peor que usar siempre la media de y: su suma de
      errores al cuadrado supera la de la media. [DATITO]'
  conceptos:
  - regresion
  n: 6
  objetivo: Calcular el error de una recta, explicar por qué se eleva al cuadrado
    y leer el R² contra la media.
  tipo: concepto
  titulo: Función de costo, error y R²
  unidad: 2
  visual: regresion.html
- activacion: Si eliges el mejor modelo mirando el test, ¿ese número de test sigue
    siendo una medida honesta?
  bloom:
    actividad_final: 'Rotular un gráfico de resultados: con qué se entrenó y sobre
      qué se evaluó cada barra.'
    criterio_dominio: No usa el test para decidir y distingue parámetro de hiperparámetro
      en un caso nuevo.
    evidencia: Asigna cada decisión (ajustar θ, elegir hiperparámetro, reportar) al
      conjunto correcto.
    nivel: Aplicar
  cierre:
    aprendiste:
    - 'El test se guarda «en el bolsillo»: no se usa para decidir.'
    - La validación sirve para elegir hiperparámetros, como el grado del polinomio.
    - Si decides con un conjunto, su número queda optimista.
    - Un test debe representar los datos donde se usará el modelo.
    no_confundir:
    - Parámetro (lo aprende el algoritmo) ≠ hiperparámetro (lo fijas tú antes).
    - Entrenado con ≠ evaluado sobre.
    - Elegir (validación) ≠ medir (test).
    pregunta_final: ¿Por qué hacen falta validación y test, si ambos son datos que
      el modelo no vio?
    procedimiento:
    - Aparta el test primero.
    - Ajusta con train; elige con validación.
    - Mide una sola vez en test y reporta.
    respuesta_final: 'Porque al elegir con la validación, esa medida se vuelve optimista;
      el test, que no se usó para decidir, da la medida honesta. [FUENTE · Repo: 05_CLASES/transcripciones/06Clase_Fundamentos_en_Ciencia_de_Datos_31_de_julio.md
      · 0:49:50]'
  conceptos:
  - train_validation_test
  n: 7
  objetivo: Separar entrenamiento, validación y test, y decir qué decisión se toma
    con cada uno.
  tipo: concepto
  titulo: Train, validation y test
  unidad: 3
  visual: train_validation_test.html
- activacion: Con una partición gana el polinomio de grado 7; con otra, el de grado
    4. ¿Cuál eliges?
  bloom:
    actividad_final: Interpretar la distribución del error de validación y decir si
      el error de test cae dentro de ella.
    criterio_dominio: Justifica la estrategia y compara todos los modelos con la misma
      partición.
    evidencia: Explica K-Fold, bootstrap y submuestreo, y elige uno según la cantidad
      de datos y su orden.
    nivel: Evaluar
  cierre:
    aprendiste:
    - Re-particionar varias veces evita depender de una partición con suerte.
    - En K-Fold cada dato valida exactamente una vez.
    - El bootstrap muestrea con reemplazo; con muestras de tamaño n contiene cerca
      del 63,2 % de los datos distintos.
    - Los modelos se comparan con la misma partición.
    no_confundir:
    - Una sola partición («validación nomás») ≠ validación cruzada.
    - Error promedio ≠ distribución del error.
    - Con orden temporal no se desordena al azar.
    pregunta_final: En sklearn un modelo obtiene −0,8 y otro −1,2 (MSE negativo).
      ¿Cuál es mejor?
    procedimiento:
    - ¿Cuántos datos hay? ¿Tienen orden temporal?
    - Elige la estrategia y fija la partición.
    - Compara por el promedio y por la dispersión del error.
    - El test sigue aparte.
    respuesta_final: 'El de −0,8: más cercano a cero significa menor error. Lo explicó
      la ayudantía, que no entra al certamen. [FUENTE · Repo: 05_CLASES/transcripciones/2026-08-07T23_57_03Z_Fundamentos_en_Ciencia_de_Datos.md
      · 0:29:51]'
  conceptos:
  - validacion_cruzada
  n: 8
  objetivo: Elegir una estrategia de validación y justificar por qué una sola partición
    puede engañar.
  tipo: concepto
  titulo: Validación cruzada y selección de modelos
  unidad: 3
  visual: validacion_cruzada.html
- activacion: Tu recta tiene R² = 0,93 con árboles de 8 a 22 cm de radio. Te piden
    el peso de uno de 45 cm. ¿Lo entregas?
  bloom:
    actividad_final: Las dudas resueltas del árbol de 45 cm y del agrónomo, al final
      de esta clase.
    criterio_dominio: 'Declara la extrapolación y explica la caída con dos mecanismos:
      haber decidido con esos datos y el cambio de distribución.'
    evidencia: Distingue interpolar de extrapolar y descompone una caída de validación
      a test en sus mecanismos.
    nivel: Evaluar
  cierre:
    aprendiste:
    - Generalizar es funcionar con datos que el modelo no ha visto.
    - 'Fuera del rango observado se extrapola: el número existe, la evidencia no.'
    - Una caída de validación a test puede venir de haber decidido con esos datos
      o de que los datos cambiaron.
    no_confundir:
    - Interpolar ≠ extrapolar.
    - R² alto dentro del rango ≠ predicción confiable fuera de él.
    - Cambio de distribución ≠ sobreajuste, aunque se combinen.
    pregunta_final: El 29,1 % del test de 2017 son suburbios que no existen en los
      datos de 2016. ¿Qué tipo de problema de generalización es?
    procedimiento:
    - Compara el caso a predecir con el rango de los datos.
    - 'Si está fuera: declara la extrapolación o consigue datos.'
    - 'Ante una caída: ¿decidiste con esos datos? ¿cambió la población?'
    respuesta_final: 'Un cambio de distribución: el modelo predice casos con un valor
      (el suburbio) que nunca vio, y solo puede apoyarse en variables que sí vio,
      como ubicación y tipo. [FUENTE · Repo: 09_RESULTADOS/resultados_temporal.json]'
  conceptos:
  - generalizacion
  n: 9
  objetivo: Decidir si una predicción es confiable según los datos que el modelo vio,
    y explicar una caída de rendimiento.
  tipo: concepto
  titulo: Generalización, extrapolación y datos no vistos
  unidad: 3
  visual: generalizacion.html
- activacion: El modelo B tiene R² 0,98 en entrenamiento y 0,54 en prueba. ¿Es el
    mejor de la tabla?
  bloom:
    actividad_final: La tabla A/B/C en el formato del profesor, y la versión con MAE.
    criterio_dominio: Calcula la brecha antes de etiquetar y lee bien una métrica
      de error, donde menos es mejor.
    evidencia: Clasifica tres modelos con la brecha, nombra el mecanismo y propone
      un remedio coherente.
    nivel: Analizar
  cierre:
    aprendiste:
    - 'Brecha grande entre entrenamiento y prueba: sobreajuste. Malo en ambos: subajuste.'
    - La complejidad (número de parámetros) mueve el balance entre ambos.
    - Un error de entrenamiento igual a cero no prueba calidad.
    - 'También se puede sobreajustar la validación: por eso existe el test.'
    no_confundir:
    - Sobreajuste ≠ subajuste ≠ error alto (C2 P2).
    - Más filas (reduce el sobreajuste) ≠ más columnas (lo aumenta) (C2 P3).
    - Error de entrenamiento ≠ calidad del modelo (C2 P7).
    pregunta_final: 'Con MAE (menos es mejor): P 0,15 / 0,92 y Q 0,71 / 0,78. ¿Cuál
      sobreajusta?'
    procedimiento:
    - 'Localiza el par de números: dentro y fuera del entrenamiento.'
    - Calcula la brecha.
    - 'Clasifica: brecha grande → sobreajuste; malo en ambos → subajuste.'
    - Nombra el mecanismo, no solo la etiqueta.
    - 'Remedio según la causa: simplificar, más filas, elegir con validación cruzada.'
    respuesta_final: 'P: error muy bajo en entrenamiento y alto en prueba, con brecha
      0,77. [FUENTE · Repo: 07_DATITO/dudas.yaml · 2026-09-19-mae-pqr]'
  conceptos:
  - overfitting_underfitting
  n: 10
  objetivo: Diagnosticar sobreajuste y subajuste calculando la brecha, y proponer
    remedios del curso.
  tipo: concepto
  titulo: Overfitting y underfitting
  unidad: 3
  visual: overfitting_underfitting.html
- activacion: '«Frío, templado, caliente»: ¿es un problema de clasificación o de regresión?'
  bloom:
    actividad_final: Clasificar cinco targets como regresión o clasificación, con
      su justificación.
    criterio_dominio: Decide por el target y no por las features, y reconoce una categoría
      con una variable numérica de fondo.
    evidencia: Decide el tipo de problema por el target y justifica por qué el MAE
      no aplica a clases.
    nivel: Analizar
  cierre:
    aprendiste:
    - Clasificar es predecir una categoría.
    - Una variable categórica no tiene orden entre sus valores.
    - El modelo puede entregar una probabilidad, no solo una clase.
    - Un modelo 100 % perfecto es sospechoso.
    no_confundir:
    - Categórica ≠ cualitativa.
    - Categoría ≠ discretización de un número.
    - Lo que define la tarea es el target, no las features.
    pregunta_final: 'Predecir la nota de 1 a 7 de un alumno: ¿regresión o clasificación?'
    procedimiento:
    - 'Mira el target: ¿número o categoría?'
    - ¿Tiene orden? ¿Hay una variable numérica de fondo?
    - Elige la tarea según para qué usarás la predicción.
    respuesta_final: 'Regresión si interesa el valor, porque es un número con distancia;
      clasificación si solo interesa aprobado o reprobado. Lo decide el uso de la
      predicción. [INFERENCIA] Así lo planteó el profesor a un grupo: [FUENTE · Repo:
      05_CLASES/transcripciones/2026-08-14T22_09_23Z_Fundamentos_en_Ciencia_de_Datos.md
      · 1:57:26]'
  conceptos:
  - clasificacion
  n: 11
  objetivo: Distinguir un problema de clasificación de uno de regresión, y explicar
    qué cambia en el error.
  tipo: concepto
  titulo: 'Clasificación: cuando la etiqueta no es un número'
  unidad: 4
  visual: clasificacion.html
- activacion: De 100 pacientes, 20 tienen cáncer. Un modelo tiene TPR 1 y FPR 0,2.
    ¿A cuántos les dirá que tienen cáncer?
  bloom:
    actividad_final: El ejercicio de los 100 pacientes, que el profesor llamó «lo
      más importante del curso».
    criterio_dominio: Declara la clase positiva, lee los rótulos de filas y columnas,
      y llega a 36 positivos en el ejercicio del profesor.
    evidencia: Construye la matriz desde un enunciado y verifica que los totales cierren.
    nivel: Aplicar
  cierre:
    aprendiste:
    - 'Cuatro casillas: VP, FP, FN, VN.'
    - Qué clase es la positiva es una convención que se declara.
    - La matriz solo describe el conjunto de test, no la realidad.
    - Una tasa multiplicada por la población da un conteo.
    no_confundir:
    - 'Filas = real ≠ filas = predicho: lee los rótulos (la lámina 19 pone lo predicho
      en las filas).'
    - Falso positivo ≠ falso negativo.
    - Test ≠ realidad.
    pregunta_final: En el caso de los 100 pacientes, ¿cuántos falsos positivos hay
      y cuál es la precisión?
    procedimiento:
    - Declara la clase positiva.
