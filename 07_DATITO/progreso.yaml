          criterios en orden -brecha para aislar el sobreajuste, nivel para
          separar subajuste de ajuste correcto- y diagnostico las tres filas
          correctamente.
      aplicar: null
      interpretar: null
      transferir: null
    sesiones: 1
    ultima_verificacion: 2026-10-28
    diagnostico:
      fecha: 2026-10-28
      detalle: 'Diagnostico inicial (banco fijo): "El árbol es mejor porque acierta en train. No sé qué es sobreajustar." [no_sabe]'
    nota: >-
      NIVEL 1 superado completo. Diagnostico inicial incorrecto por no calcular
      la brecha; corrigio con andamiaje. Respondio bien b) -"B memoriza pero
      generaliza peor"- y c) -regularizar amortigua, podar elimina-, que es
      justo la distincion de la P7 del Certamen 2. Observacion para el papel:
      no declaro el supuesto de que B fuera un arbol, y el enunciado no lo
      decia. Es el patron de la P11.

      NIVEL 2 a medias. Diagnostico correctamente las tres filas de un caso con
      MAE, donde la metrica se invierte -menos es mejor-. No cayo en aplicar la
      regla de memoria: leyo que significaba el numero antes de restar. Era la
      trampa del problema. Quedaron sin responder b) y c).

      APLICAR no se acredita hasta completar un nivel 2 entero sin ayuda.

