# Mapa de ensenanza: DONDE se enseno cada concepto, con rango y hablante.
#
# Curado a mano el 2026-09-21 leyendo las transcripciones (no es la "primera
# mencion" automatica de indice_clases.yaml, que cuenta palabras y no distingue
# quien habla). Lo consume 03_CODIGO/construir_navegacion.py para el bloque
# "Donde se enseno" de cada visual, y 03_CODIGO/verificar_visuales.py comprueba
# que cada marca exista en su transcripcion.
#
# Reglas:
#   - las marcas son de la transcripcion automatica (pueden desviarse segundos)
#   - hablante: titular | segundo_docente | ayudantia | alumnos | invitado
#   - evaluable: el profesor titular declaro «Entran solo mis clases. No entran
#     las clases de Alejandra» (03Clase_Recuperacion 15-jul, 1:18:16). Lo dicho
#     en ayudantias se estudia, pero no es materia de certamen.
#   - spoiler: el tramo resuelve en vivo un practico; ver antes el (vacio).
#
# Para integrar una clase nueva: transcribir, correr integrar_clase.py
# --sin-subir, agregar aqui la clase y sus tramos, y correr
# construir_navegacion.py. Ningun HTML se edita a mano para eso.

